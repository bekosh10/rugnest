<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<title>תמנון – שילוט</title>
<!-- TAMNUN_APP -->

<style>
  @font-face { font-family:Heebo; src:url(lib/fonts/heebo-hebrew-400-normal.woff2) format('woff2'); }
  :root { --bg:#f4f6f8; --card:#fff; --line:#e2e6ea; --text:#1d2733; --muted:#6b7785; --blue:#1f6feb; --blue2:#e8f0fe; --red:#d93025; --redbg:#fdecea; --yel:#fff6d6; --green:#1e8e3e; --greenbg:#e6f4ea; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:"Segoe UI",Heebo,-apple-system,Arial,sans-serif; background:var(--bg); color:var(--text); font-size:14px; }
  header { position:sticky; top:0; z-index:5; display:flex; align-items:center; gap:16px; padding:12px 20px; background:var(--card); border-bottom:1px solid var(--line); }
  header h1 { font-size:18px; margin:0; white-space:nowrap; }
  .so { font-size:18px; font-weight:700; direction:ltr; color:var(--blue); }
  .spacer { flex:1; }
  button { font:inherit; padding:8px 14px; border-radius:8px; border:1px solid var(--line); background:#fff; cursor:pointer; }
  button:hover { background:#f0f3f6; }
  button.primary { background:var(--blue); color:#fff; border-color:var(--blue); font-weight:600; }
  button.primary:hover { background:#1a5fd0; }
  button.small { padding:3px 9px; font-size:12px; }
  button:disabled { opacity:.45; cursor:default; }
  main { padding:16px 20px 70px; }
  .layout { display:flex; gap:14px; align-items:flex-start; }
  .mainCol { flex:1; min-width:0; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:14px 16px; margin-bottom:14px; }
  .card h2 { font-size:15px; margin:0 0 10px; display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
  .muted { color:var(--muted); font-size:13px; font-weight:400; }
  #drop { border:2px dashed #b8c2cc; border-radius:14px; padding:34px 20px; text-align:center; background:#fafbfc; }
  body.over #drop { border-color:var(--blue); background:var(--blue2); }
  #drop.small .big, #drop.small > .muted { display:none; }
  #drop.small .inputs { margin-top:0; }
  #drop .big { font-size:19px; font-weight:600; margin-bottom:8px; }
  .inputs { display:flex; gap:10px; flex-wrap:wrap; margin-top:12px; justify-content:center; }
  .chip { display:inline-flex; align-items:center; gap:6px; padding:4px 10px; border-radius:16px; background:#eef1f4; font-size:12.5px; }
  .chip.ok { background:var(--greenbg); color:var(--green); }
  .chip.no { background:var(--redbg); color:var(--red); }
  table { border-collapse:collapse; width:100%; }
  th, td { padding:5px 8px; border-bottom:1px solid var(--line); text-align:right; vertical-align:middle; }
  th { font-size:12px; color:var(--muted); font-weight:600; background:#fafbfc; }

  td.fname, th.fname { font-size:13px; text-align:left; }
  tr.miss td { background:var(--redbg); }
  tr.fix td { background:var(--yel); }
  tr.zero td { color:#aab3bd; }
  tr.off td { color:#a3acb6; background:#f3f4f6; }
  tr.off td.st { text-decoration:line-through; text-decoration-color:#8a949e; }
  tr.off img.th { opacity:.35; }
  button.rm { border:none; background:none; color:#9aa5b1; font-size:16px; padding:2px 8px; line-height:1; }
  button.rm:hover { color:var(--red); background:var(--redbg); }
  tr.off button.rm { color:var(--blue); font-size:14px; }
  img.th { height:34px; max-width:120px; border:1px solid #d5dbe1; border-radius:3px; display:block; background:#fff; }
  .sw { display:inline-block; width:12px; height:12px; border-radius:3px; border:1px solid #c5ccd3; vertical-align:middle; margin-inline-end:4px; }
  .sw.red { background:#e11d2a; } .sw.white { background:#fff; } .sw.blue { background:#1d4fe1; } .sw.color { background:linear-gradient(135deg,#ec2a8a,#f5e50a); }
  .badge { display:inline-block; padding:1px 8px; border-radius:10px; background:#eef1f4; font-size:12px; white-space:nowrap; }
  .badge.red { background:var(--redbg); color:var(--red); }
  .badge.green { background:var(--greenbg); color:var(--green); }
  .badge.yel { background:#fde9a8; color:#7a5800; }
  select { font:inherit; font-size:12px; padding:2px 4px; width:120px; }
  .fn { unicode-bidi:isolate; direction:ltr; display:inline-block; }
  #stickTabs { position:sticky; top:var(--hh,62px); z-index:4; background:var(--bg); padding-top:4px; }
  .tabcard h2.tabhead { position:sticky; top:var(--t2,120px); z-index:3; background:var(--card); margin:0; padding:10px 0; }
  .tabcard th { position:sticky; top:var(--t3,170px); z-index:3; box-shadow:0 1px 0 var(--line); }
  .tabcard { padding-top:0; }
  .mtabs { display:flex; gap:0; margin-bottom:0; border-bottom:2px solid var(--blue); }
  .mtabs button { padding:10px 22px; border-radius:10px 10px 0 0; border:1px solid var(--line); border-bottom:none; background:#eef1f4; font-size:15px; font-weight:700; color:var(--muted); display:flex; align-items:center; gap:8px; margin-inline-end:4px; }
  .mtabs button.on { background:var(--blue); color:#fff; border-color:var(--blue); }
  .mtabs .dot { min-width:18px; padding:0 5px; border-radius:9px; font-size:11px; text-align:center; background:var(--greenbg); color:var(--green); }
  .mtabs .dot.red { background:var(--red); color:#fff; } .mtabs .dot.yel { background:#e8a200; color:#fff; }
  .ttabs { padding:10px 0 0; }
  .ttabs { display:flex; flex-wrap:wrap; gap:6px; margin-bottom:10px; }
  .ttabs button { padding:7px 12px; border-radius:9px; background:#fff; font-weight:600; display:flex; align-items:center; gap:6px; }
  .ttabs button.on { background:var(--blue); color:#fff; border-color:var(--blue); }
  .ttabs .dot { min-width:18px; padding:0 5px; border-radius:9px; font-size:11px; text-align:center; background:var(--greenbg); color:var(--green); }
  .ttabs .dot.red { background:var(--red); color:#fff; }
  .ttabs .dot.yel { background:#e8a200; color:#fff; }
  .ttabs button.on .dot { box-shadow:0 0 0 1px #fff; }
  .sum td.n { white-space:nowrap; }
  #leftCol { width:330px; flex:none; position:sticky; top:70px; display:flex; flex-direction:column; gap:12px; max-height:calc(100vh - 70px - 50px); }
  aside#side { padding:0; overflow:hidden; display:flex; flex-direction:column; min-height:0; flex:1 1 auto; margin:0; }
  #dropSlot:empty { display:none; }
  #dropSlot #drop { margin:0; padding:10px 12px; text-align:right; flex:none; }
  #dropSlot #drop .inputs { justify-content:flex-start; flex-direction:column; align-items:stretch; gap:5px; margin-top:6px; max-height:28vh; overflow-y:auto; }
  #dropSlot #drop .chip { border-radius:7px; }
  #dropSlot #drop .ftitle { display:block; font-weight:600; font-size:13px; }
  #drop .ftitle { display:none; }
  .tabs { display:flex; border-bottom:1px solid var(--line); flex:none; }
  .tabs button { flex:1; border:none; border-radius:0; padding:10px 6px; background:#fafbfc; color:var(--muted); font-weight:600; }
  .tabs button.on { background:#fff; color:var(--blue); box-shadow:inset 0 -2px 0 var(--blue); }
  .tabs .cnt { display:inline-block; min-width:18px; padding:0 5px; border-radius:9px; font-size:11px; background:#e1e6eb; color:var(--text); margin-inline-start:4px; }
  .tabs .cnt.red { background:var(--red); color:#fff; }
  .tabs .cnt.yel { background:#e8a200; color:#fff; }
  .pane { overflow-y:auto; min-height:0; padding:10px 14px 14px; }
  .pane .it { padding:7px 0; border-bottom:1px solid var(--line); font-size:13px; }
  .pane .it b { font-weight:600; }
  .pane .it .muted { font-size:12px; }
  .pane .empty { color:var(--green); padding:16px 0; text-align:center; }
  .grp { margin:10px 0 2px; font-size:12px; color:var(--muted); font-weight:700; }
  .sum table td { padding:5px 4px; font-size:13px; }
  .sum tr.mrow td { background:#eef3fd; cursor:pointer; font-weight:700; font-size:14px; border-top:6px solid #fff; }
  .sum tr.trow td { font-weight:600; cursor:pointer; }
  .sum tr.trow td:first-child { padding-inline-start:20px; }
  .sum tr.frow td { font-size:12px; color:var(--muted); }
  .sum tr.frow td:first-child { padding-inline-start:36px; }
  .sum .arr { display:inline-block; width:14px; color:var(--blue); }
  .sum tr.tot td { font-weight:700; border-top:2px solid var(--line); }
  footer { position:fixed; bottom:0; left:0; right:0; display:flex; align-items:center; gap:12px; padding:8px 20px; background:var(--card); border-top:1px solid var(--line); font-size:12px; color:var(--muted); }
  .toast { position:fixed; bottom:50px; left:20px; background:#1d2733; color:#fff; padding:12px 16px; border-radius:10px; z-index:30; max-width:560px; box-shadow:0 6px 24px rgba(0,0,0,.25); }
  .modal-bg { position:fixed; inset:0; background:rgba(20,30,40,.35); display:flex; align-items:flex-start; justify-content:center; padding-top:60px; z-index:20; }
  .modal { background:#fff; border-radius:14px; width:min(640px,94vw); max-height:80vh; overflow:auto; padding:18px 22px; box-shadow:0 10px 40px rgba(0,0,0,.2); }
  .modal h3 { margin:0 0 12px; font-size:18px; padding-left:40px; }
  .modal { position:relative; }
  .modal .mx { position:sticky; top:0; float:left; margin:-6px -8px 0 0; width:34px; height:34px; border-radius:50%; border:1px solid var(--line); background:#fff; font-size:18px; line-height:1; padding:0; color:var(--muted); z-index:2; }
  .modal .mx:hover { background:var(--redbg); color:var(--red); }
  .modal .foot { display:flex; gap:8px; margin-top:16px; }
  .modal.wide { width:min(1300px,97vw); max-height:92vh; }
  .lay-set { display:flex; flex-wrap:wrap; gap:14px; align-items:center; margin-bottom:10px; }
  .lay-set input { width:64px; }
  .lay-sheets { display:flex; gap:14px; overflow-x:auto; padding:8px 2px 12px; direction:ltr; }
  .lay-sh { flex:0 0 auto; text-align:center; font-size:12px; }
  .lay-sh svg { background:#fff; border:1px solid #bbb; box-shadow:0 1px 4px rgba(0,0,0,.15); display:block; }
  .lay-sh .cp { font-weight:bold; color:var(--red); }
  .busy { position:fixed; inset:0; background:rgba(255,255,255,.7); display:flex; align-items:center; justify-content:center; z-index:40; font-size:18px; font-weight:600; }
  .tabhead { display:flex; align-items:center; gap:10px; }
  .tabhead .r { margin-inline-start:auto; }
</style>

<body>
<header>
  <h1>תמנון – שילוט</h1>
  <span class="so" id="soLbl"></span>
  <div class="spacer"></div>
  <button id="bBank">בנק גרפיקות</button>
  <button id="bDict">מילון שמות</button>
  <button id="bOpen">פתיחת עבודה</button>
  <button id="bSave" disabled>שמירת עבודה</button>
  <input type="file" id="fOpen" accept=".tamnun" style="display:none">
  <button id="bClear">ניקוי</button>
  <button id="bLayout" disabled>פריסת מגנטי</button>

<main>
  <div class="layout">
    <div class="mainCol">
      <div class="card" id="drop">
        <div class="big">גררי לכאן את כל הקבצים של ההזמנה</div>
        <div class="muted">הטבלה (אקסל), הזמנת העבודה (PDF), וקבצי העיצוב (PDF) – אפשר הכל ביחד, או תיקייה</div>
        <span class="ftitle">קבצים <span class="muted">– אפשר לגרור עוד לכל מקום בחלון</span></span>

<script type="module">
import * as pdfjs from './lib/pdf.min.mjs';
pdfjs.GlobalWorkerOptions.workerSrc = './lib/pdf.worker.min.mjs';
const C = window.TamnunCore, PDFLib = window.PDFLib, ExcelJS = window.ExcelJS;
const deps = { pdfjs, PDFLib, ExcelJS, makeCanvas: (w, h) => { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; } };
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const desk = window.desk || null;

const MLABEL = m => m;
const S = { removed: {}, cur: 0, table: null, tableName: '', so: null, soName: '', arts: [], plan: null, pane: 'miss', open: {}, override: {} };

/* ---------------- loading ---------------- */
async function busy(msg, fn) {
  const d = document.createElement('div'); d.className = 'busy'; d.textContent = msg; document.body.appendChild(d);
  try { return await fn(); } finally { d.remove(); }
}
function toast(html, ms = 5000) { const t = document.createElement('div'); t.className = 'toast'; t.innerHTML = html; document.body.appendChild(t); setTimeout(() => t.remove(), ms); }

async function pdfKind(buf) {
  try {
    const doc = await pdfjs.getDocument({ data: new Uint8Array(buf).slice() }).promise;
    const tc = await (await doc.getPage(1)).getTextContent();
    const t = tc.items.map(i => i.str).join(' ');
    const n = doc.numPages; await doc.destroy();
    if (n <= 3 && (/הזמנת עבודה/.test(t) || (/SO/.test(t) && /יח'/.test(t)))) return 'so';
    if (/צבע/.test(t) && /(פורמט|גודל)/.test(t) && /(מחסן|הזמנה|תמונה)/.test(t)) return 'tablepdf';
    return 'art';
  } catch (e) { return 'art'; }
}
async function isSO(buf) {
  try {
    const doc = await pdfjs.getDocument({ data: new Uint8Array(buf).slice() }).promise;
    if (doc.numPages > 3) { await doc.destroy(); return false; }
    const tc = await (await doc.getPage(1)).getTextContent();
    const t = tc.items.map(i => i.str).join(' ');
    await doc.destroy();
    return /הזמנת עבודה/.test(t) || (/SO/.test(t) && /יח'/.test(t));
  } catch (e) { return false; }
}

async function addFiles(list, fromJob) {   // list of {name, buf}
  await busy('קורא קבצים…', async () => {
    for (const f of list) {
      const n = f.name.toLowerCase();
      try {
        if (/\.xlsx$/.test(n)) {
          S.table = await C.readTableXlsx(f.buf, ExcelJS); S.tableName = f.name; S.tableBuf = new Uint8Array(f.buf).slice();
          if (!S.table.length) toast('לא מצאתי לשוניות עם טבלת שילוט באקסל ' + esc(f.name));
        } else if (/\.pdf$/.test(n)) {
          const kind = await pdfKind(f.buf);
          if (kind === 'so') { S.soBuf = new Uint8Array(f.buf).slice(); S.so = await C.readSO(S.soBuf.slice(), pdfjs); S.soName = f.name; }
          else if (kind === 'tablepdf') { S.tablePdf = f.name; }
          else {
            S.arts = S.arts.filter(a => a.name !== f.name);
            S.arts.push(await C.analyzeArtwork(f.buf, f.name, deps, { thumb: 160, keepThumb: true }));
          }
        }
      } catch (e) { console.error(e); toast('שגיאה בקריאת ' + esc(f.name) + ': ' + esc(e.message || e)); }
    }
  });
  recompute();
}

document.addEventListener('dragover', e => { e.preventDefault(); document.body.classList.add('over'); });
document.addEventListener('dragleave', e => { if (!e.relatedTarget) document.body.classList.remove('over'); });
document.addEventListener('drop', async e => {
  e.preventDefault(); document.body.classList.remove('over');
  const files = [...e.dataTransfer.files];
  const bk = files.find(f => /\.tamnunbank$/i.test(f.name));
  if (bk) { bankImport(await bk.arrayBuffer()); return; }
  const job = files.find(f => /\.tamnun$/i.test(f.name));
  if (job) { openJob(await job.arrayBuffer()); return; }
  const out = [];
  if (desk) {
    const paths = files.map(f => desk.pathOf(f)).filter(Boolean);
    const all = await desk.scan(paths);
    for (const it of all) if (/\.(pdf|xlsx)$/i.test(it.path)) out.push({ name: it.path.split(/[\\/]/).pop(), buf: await desk.readFile(it.path) });
  } else {
    for (const f of files) out.push({ name: f.name, buf: await f.arrayBuffer() });
  }
  addFiles(out);
});
$('#bClear').onclick = () => { S.genThumb = {}; Object.assign(S, { removed: {}, cur: 0, tablePdf: '', tableBuf: null, soBuf: null, table: null, tableName: '', so: null, soName: '', arts: [], plan: null, override: {} }); recompute(); };

/* ---------------- graphics bank (IndexedDB, stays on this computer) ---------------- */
// every page that went out as-is is kept, so a sign missing next time can come from here
function bankDb() {
  return new Promise((res, rej) => {
    const r = indexedDB.open('tamnun', 1);
    r.onupgradeneeded = () => r.result.createObjectStore('bank', { keyPath: 'id' });
    r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
  });
}
async function idbAll() {
  const db = await bankDb();
  return new Promise((res, rej) => { const q = db.transaction('bank').objectStore('bank').getAll(); q.onsuccess = () => res(q.result || []); q.onerror = () => rej(q.error); });
}
async function idbPut(list) {
  const db = await bankDb();
  return new Promise((res, rej) => { const tx = db.transaction('bank', 'readwrite'); list.forEach(e => tx.objectStore('bank').put(e)); tx.oncomplete = res; tx.onerror = () => rej(tx.error); });
}
async function idbDel(id) {
  const db = await bankDb();
  return new Promise((res, rej) => { const tx = db.transaction('bank', 'readwrite'); tx.objectStore('bank').delete(id); tx.oncomplete = res; tx.onerror = () => rej(tx.error); });
}
/* --- the bank in a shared network folder (installer 3+): plain PDFs + bank-index.json --- */
S.bankDir = null;               // { dir, ok, chosen }
const IDX = 'bank-index.json';
async function bankDirInfo() {
  if (!desk || !desk.bankDir) return null;
  try { S.bankDir = await desk.bankDir(); } catch (e) { S.bankDir = null; }
  return S.bankDir;
}
const useFolder = () => !!(S.bankDir && S.bankDir.ok);
async function folderIndex() {
  try { return JSON.parse(new TextDecoder().decode(await desk.bankRead(S.bankDir.dir, IDX))); } catch (e) { return { v: 1, entries: {} }; }
}
async function folderAll() {
  const dir = S.bankDir.dir;
  const files = (await desk.bankList(dir)).filter(f => /\.pdf$/i.test(f.rel));
  const idx = await folderIndex();
  const out = []; let changed = false;
  for (const f of files) {
    let meta = idx.entries[f.rel];
    let bytes;
    try { bytes = await desk.bankRead(dir, f.rel); } catch (e) { continue; }
    if (!meta || meta.fsize !== f.size) {
      // a PDF someone put in the folder by hand – read it
      try {
        const a = await C.analyzeArtwork(bytes.slice(), f.rel, deps, { thumb: 160, keepThumb: true });
        const p = a.pages[0];
        const text = p.text || f.rel.split('/').pop().replace(/\.pdf$/i, '');
        meta = { id: [sizeKey(p.size), p.color, C.norm(text)].join('|'), size: p.size, color: p.color, text, nums: p.nums, thumb: p.thumb, so: 'הוסף ידנית', date: new Date().toISOString() };
      } catch (e) { continue; }
      meta.fsize = f.size; idx.entries[f.rel] = meta; changed = true;
    }
    out.push({ ...meta, rel: f.rel, bytes });
  }
  // forget files that were deleted by hand
  for (const rel of Object.keys(idx.entries)) if (!files.some(f => f.rel === rel)) { delete idx.entries[rel]; changed = true; }
  if (changed) { try { await desk.bankWrite(dir, IDX, new TextEncoder().encode(JSON.stringify(idx))); } catch (e) {} }
  return out;
}
const fileLabel = e => C.fileSafe([C.toEnglish(C.COLOR_HE[e.color] || '', S.en).text, C.toEnglish(e.text, S.en).text].filter(Boolean).join(' ').toLowerCase()) || 'graphic';
async function folderPut(list) {
  const dir = S.bankDir.dir;
  const idx = await folderIndex();
  // folder per type: an existing folder with graphics of a close size, otherwise the type's name
  const existing = Object.entries(idx.entries).map(([rel, m]) => ({ folder: rel.split('/')[0], size: m.size }));
  const close = (a, b) => Math.abs(a[0] - b[0]) <= 1.5 && Math.abs(a[1] - b[1]) <= 1.5;
  const newTypes = bankTypes(list.filter(e => !existing.some(x => close(x.size, e.size))));
  const folderOf = e => {
    const ex = existing.find(x => close(x.size, e.size)); if (ex) return ex.folder;
    const g = newTypes.find(g => g.list.includes(e)); return C.fileSafe(g ? g.name : typeLabel(e.tab));
  };
  for (const e of list) {
    const old = Object.keys(idx.entries).find(r => idx.entries[r].id === e.id);
    const folder = folderOf(e);
    let rel = old || `${folder}/${fileLabel(e)}.pdf`;
    // same sign in another size (another order) → the size goes into the name
    if (!old && idx.entries[rel]) rel = `${folder}/${fileLabel(e)} ${sizeKey(e.size)}.pdf`;

async function folderDel(id) {

async function folderSeed() {

  const files = (await desk.bankList(S.bankDir.dir)).filter(f => /\.pdf$/i.test(f.rel));
  if (files.length) return 0;

// "שילוט A3 מתכתי" → "A3 מתכתי", "שילוטי A5 נייר דו"צ" → "A5"
const typeLabel = t => String(t || '').replace(/שילוטי?\s*/g, '').replace(/נייר\s*דו"?צ'?'?|דו"צ/g, '').replace(/\s+/g, ' ').trim() || 'אחר';
// group bank entries into types: sizes that are close (≤1.5 ס"מ) are one type, named by the most common label
function bankTypes(all) {
  const groups = [];
  all.forEach(e => {
    let g = groups.find(g => Math.abs(g.size[0] - e.size[0]) <= 1.5 && Math.abs(g.size[1] - e.size[1]) <= 1.5);
    if (!g) { g = { size: e.size, list: [] }; groups.push(g); }
    g.list.push(e);
  });
  groups.forEach(g => {
    const cnt = {};
    g.list.forEach(e => { const l = typeLabel(e.tab); cnt[l] = (cnt[l] || 0) + 1; });
    g.name = Object.entries(cnt).sort((a, b) => b[1] - a[1])[0][0];
  });
  // same name twice (e.g. two "A5" sizes) → add the size
  groups.forEach(g => { if (groups.filter(x => x.name === g.name).length > 1) g.name += ' ' + g.size.map(x => +x.toFixed(1)).join('×'); });
  return groups.sort((a, b) => a.name.localeCompare(b.name, 'he'));
}
const sizeKey = z => z.map(x => (Math.round(x * 2) / 2).toFixed(1)).join('x');
async function bankSaveItems(list) {
  const out = [];
  for (const { it, bytes } of list) {
    const art = S.allArts[it.art], p = art.pages[it.page];
    // text: what the page says; if the page has no readable text (outlines) – the table's words
    const text = p.text && (C.matchWords(p.text).length || p.nums.length) ? p.text : (it.row.text || p.text);
    const key = [sizeKey(p.size), p.color, C.norm(text)].join('|');
    out.push({ id: key, size: p.size, color: p.color, text, nums: p.nums, thumb: p.thumb, bytes: bytes instanceof Uint8Array ? bytes : new Uint8Array(bytes),
      tab: it.tab, so: (S.so && S.so.soNumber) || '', date: new Date().toISOString() });
  }
  if (out.length) { await bankPut(out); await bankLoad(); }
  return out.length;
}

async function bankLoad() {

      } catch (err) { console.error(err); }

async function bankSyncShared(force) {

function recompute() {

  S.plan = S.table ? C.buildPlan(S.table, S.arts, S.so, { en: S.en || {}, bankArts: S.bankArts || [] }) : null;

// manual page choice per row: key = tabIndex:rowIndex → page index (or -1 = none)
function applyOverrides() {
  const P = S.plan;
  for (const [k, pg] of Object.entries(S.override)) {
    const [ti, ri] = k.split(':').map(Number);
    const tab = S.table[ti], row = tab.rows[ri];
    if (!row.qty) continue;
    const ai = P.tabArt[ti]; if (ai < 0) continue;
    P.items = P.items.filter(i => i.row !== row);
    P.fixed = P.fixed.filter(i => i.row !== row);
    P.missing = P.missing.filter(m => m.row !== row);
    if (pg < 0) { P.missing.push({ tab: tab.name, ti, row, reason: 'סומן ידנית – בלי עמוד' }); continue; }
    const va = P.virt[ti], vp = va.pages[pg];
    const srcA = vp.src != null ? vp.src : ai, srcP = vp.srcPage != null ? vp.srcPage : pg;
    const nm = C.makeName(tab, row, vp, false, S.en || {});
    P.items.push({ ti, tab: tab.name, machine: tab.machine, row, art: srcA, page: srcP, vpage: pg, kind: 'ok', m: { kind: 'ok', page: pg, manual: true }, name: nm.name, noEn: nm.missing, qty: row.qty, manual: true });
    P.fixed.push(P.items[P.items.length - 1]);
  }
}

    if (!ok) return;
  }
  if (!desk) { toast('הייצוא עובד רק בתוכנה המותקנת'); return; }
  const parent = await desk.pickFolder({ title: 'איפה ליצור את תיקיית ההזמנה?' });
  if (!parent) return;
  await busy('מכין קבצים…', async () => {
    const files = [], failed = [], cache = {}, bankAdd = [];
    for (const it of P.items) {
      const bytes = await C.buildItemPdf(it, S.allArts, PDFLib, cache);
      if (!bytes) { failed.push(it); continue; }
      // machine / type (tab) – needs the newer installer; older shells get one level
      files.push({ sub: S.shellVersion >= 2 ? [it.machine, it.tab] : it.machine, name: it.name, data: bytes });
      if (it.kind === 'ok' && !it.m.guess && !it.m.bank) bankAdd.push({ it, bytes });
    }
    try { await bankSaveItems(bankAdd); } catch (e) { console.error(e); }
    failed.forEach(it => P.missing.push({ tab: it.tab, row: it.row, reason: 'לא הצלחתי ליצור את הקובץ – צריך קובץ מהלקוח' }));
    const report = await C.buildReport(P, S.table, S.so, ExcelJS);
    const folderName = ((S.so && S.so.soNumber) || 'הזמנה') + ' תמנון';
    const r = await desk.exportFiles({ parent, folderName, files, report });
    if (r.ok) toast(`נוצרו ${files.length} קבצים ב-<b>${esc(r.dir)}</b>${failed.length ? `<br>${failed.length} קבצים לא נוצרו – ראי חוסרים` : ''}${S.shellVersion < 2 ? '<br>לתיקייה לכל סוג צריך להתקין את קובץ ההתקנה החדש' : ''}`, 9000);
    else toast('שגיאה בייצוא: ' + esc(r.error), 9000);
    if (failed.length) renderSide();
  });
};


/* ---------------- EFI layout (magnet): preview + export ---------------- */
const LAYKEY = 'tamnunLayout';
function layCfg() { try { return JSON.parse(localStorage.getItem(LAYKEY)) || {}; } catch (e) { return {}; } }
function laySave(c) { try { localStorage.setItem(LAYKEY, JSON.stringify(c)); } catch (e) {} }
const layJob = tab => /a3/i.test(tab) ? 'magneti A3' : 'magneti';
$('#bLayout').onclick = async () => {
  const P = S.plan; if (!P) return;
  const mag = P.items.filter(i => i.machine === 'מגנטי');
  const tabs = [...new Set(mag.map(i => i.tab))];
  const groupsOf = {};
  await busy('מכין פריסה…', async () => {
    const cache = {};
    for (const t of tabs) {
      groupsOf[t] = [];
      for (const it of mag.filter(i => i.tab === t)) {
        const bytes = await C.buildItemPdf(it, S.allArts, PDFLib, cache);
        if (!bytes) continue;
        const d = await PDFLib.PDFDocument.load(bytes); const sz = d.getPage(0).getSize();
        const art = S.allArts[it.art], page = art && art.pages[it.vpage != null ? it.vpage : it.page];
        groupsOf[t].push({ bytes, w: sz.width, h: sz.height, qty: it.qty, color: it.row.color, thumb: thumbOf(it, page), name: it.name });
      }
    }
  });
  let cfg = layCfg(), cur = tabs[0];
  const optsFor = t => ({ ...C.LAYOUT_DEF, width: (cfg.width || {})[t] || C.layoutWidthFor(t), gap: cfg.gap != null ? cfg.gap : C.LAYOUT_DEF.gap, maxLen: cfg.maxLen || C.LAYOUT_DEF.maxLen, bleed: cfg.bleed != null ? cfg.bleed : C.LAYOUT_DEF.bleed });
  const soNo = () => ((S.so && S.so.soNumber) || '').replace(/\D/g, '');
  const bg = document.createElement('div'); bg.className = 'modal-bg';
  bg.innerHTML = `<div class="modal wide"><button class="mx" title="סגירה">✕</button><h3>פריסת מגנטי – תצוגה לפני ייצוא</h3>
    <div class="mtabs" id="layTabs"></div>
    <div class="lay-set">
      <label>רוחב גיליון <input type="number" step="0.1" id="lW"> ס"מ</label>
      <label>אורך מקסימלי <input type="number" step="1" id="lL"> ס"מ</label>
      <label>רווח בין סוגים <input type="number" step="0.1" id="lG"> ס"מ</label>
      <label>גלישה <input type="number" step="0.05" id="lB"> ס"מ</label>
      <span class="muted" id="lInfo"></span>
    </div>
    <div class="lay-sheets" id="laySh"></div>
    <div class="foot"><button class="primary" id="lExp">ייצוא…</button><button id="lClose">סגירה</button></div></div>`;
  document.body.appendChild(bg);
  const close = () => bg.remove();
  bg.querySelector('.mx').onclick = close; bg.querySelector('#lClose').onclick = close;
  const draw = () => {
    const o = optsFor(cur);
    bg.querySelector('#layTabs').innerHTML = tabs.map(t => `<button class="${t === cur ? 'on' : ''}" data-t="${esc(t)}">${esc(t)}</button>`).join('');
    bg.querySelectorAll('#layTabs button').forEach(b => b.onclick = () => { cur = b.dataset.t; draw(); });
    bg.querySelector('#lW').value = o.width; bg.querySelector('#lL').value = o.maxLen; bg.querySelector('#lG').value = o.gap; bg.querySelector('#lB').value = o.bleed;
    const gs = groupsOf[cur] || [];
    const sheets = C.planLayout(gs, o), CMP = 72 / 2.54, sc = 0.9;   // px per cm
    const prints = sheets.reduce((a, s) => a + s.copies, 0), units = sheets.reduce((a, s) => a + s.copies * s.cells.length, 0);
    bg.querySelector('#lInfo').textContent = `${sheets.length} גיליונות שונים · ${prints} הדפסות · ${units} שלטים (בהזמנה ${gs.reduce((a, g) => a + g.qty, 0)})`;
    const label = `${soNo()} tamnoon ${layJob(cur)}`;
    bg.querySelector('#laySh').innerHTML = sheets.map((s, si) => {
      const W = s.W / CMP, H = s.H / CMP;
      const cells = s.cells.map(c => {
        const g = gs[c.g], x = c.x / CMP, y = (s.H - c.y - c.h) / CMP, w = c.w / CMP, h = c.h / CMP;
        const fill = { red: '#e03030', white: '#f4f4f4', blue: '#2a5bd7', black: '#222' }[g.color] || '#ccc';
        const img = g.thumb ? (c.rot
          ? `<image href="${g.thumb}" x="0" y="0" width="${h}" height="${w}" preserveAspectRatio="none" transform="translate(${x},${y + h}) rotate(-90)"/>`
          : `<image href="${g.thumb}" x="${x}" y="${y}" width="${w}" height="${h}" preserveAspectRatio="none"/>`) : '';
        return `<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="${fill}"/>${img}<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="none" stroke="#7a2bd6" stroke-width="0.25"/><title>${esc(g.name)}</title>`;
      }).join('');
      const dots = [[0.5, H - 0.5], [W - 0.5, H - 0.5], [W - 0.5 - 5.08, H - 0.5], [0.5, 0.5], [W - 0.5, 0.5]].map(([x, y]) => `<circle cx="${x}" cy="${y}" r="0.3"/>`).join('');
      const tx = W - 0.8 - 5.08 - 5;
      return `<div class="lay-sh"><div>גיליון ${si + 1}/${sheets.length} ${s.copies > 1 ? `<span class="cp">× ${s.copies}</span>` : ''}</div>
        <svg width="${W * sc}" height="${H * sc}" viewBox="0 0 ${W} ${H}">${cells}${dots}<text x="${tx}" y="${H - 0.35}" font-size="0.9" text-anchor="end">${esc(label)} sheet ${si + 1}/${sheets.length} x ${s.copies}</text></svg>
        <div class="muted">${(s.W / CMP).toFixed(1)}×${(s.H / CMP).toFixed(1)} · ${s.cells.length} שלטים</div></div>`;
    }).join('') || '<div class="muted">אין שלטים</div>';
  };
  const upd = () => {
    const w = +bg.querySelector('#lW').value, L = +bg.querySelector('#lL').value, G = +bg.querySelector('#lG').value;
    cfg.width = { ...(cfg.width || {}) }; if (w > 10) cfg.width[cur] = w;
    const B = +bg.querySelector('#lB').value;
    if (L > 20) cfg.maxLen = L; if (G >= 0) cfg.gap = G; if (B >= 0 && B <= 1) cfg.bleed = B;
    laySave(cfg); draw();
  };
  ['#lW', '#lL', '#lG', '#lB'].forEach(id => bg.querySelector(id).onchange = upd);
  bg.querySelector('#lExp').onclick = () => exportDialog();
  const isWin = /win/i.test(navigator.platform || navigator.userAgent);
  const exportDialog = () => {
    const d = document.createElement('div'); d.className = 'modal-bg';
    const pick = async (key, title) => {
      if (!desk) { toast('עובד רק בתוכנה המותקנת'); return; }
      const f = await desk.pickFolder({ title, start: cfg[key] }); if (!f) return;
      cfg[key] = f; laySave(cfg); fill();
    };
    const fill = () => {
      const so = soNo() || 'order', t = layJob(cur).toLowerCase(), star = isWin ? 'x' : '*';
      d.innerHTML = `<div class="modal"><button class="mx" title="סגירה">✕</button><h3>הגדרות ייצוא פריסה</h3>
        <h4 style="margin:10px 0 4px">פרינט</h4>
        <div>תיקייה: <b dir="ltr" style="unicode-bidi:isolate">${esc(cfg.printDir || '— לא נבחרה —')}</b> <button class="small" id="pP">בחירה…</button></div>
        <div class="muted" style="margin-top:4px">קובץ לכל גיליון: <span dir="ltr" style="unicode-bidi:isolate">${esc(so)} tamnoon ${esc(t)} 001${star}6.pdf</span> (מספר גיליון ${star} כמות הדפסות). גרפיקה + נקודות + טקסט, בלי קווים.</div>
        <label style="display:block;margin-top:6px"><input type="checkbox" id="pProof" ${cfg.proof ? 'checked' : ''}> גם קובץ proof לבדיקה (גרפיקה + חיתוך) בתיקיית הפרינט</label>
        <h4 style="margin:14px 0 4px">קאט</h4>
        <div>תיקייה: <b dir="ltr" style="unicode-bidi:isolate">${esc(cfg.cutDir || '— לא נבחרה —')}</b> <button class="small" id="pC">בחירה…</button></div>
        <div class="muted" style="margin-top:4px">קובץ אחד עם כל הגיליונות: <span dir="ltr" style="unicode-bidi:isolate">${esc(so)} tamnoon ${esc(t)} cut.pdf</span>. קווי חיתוך (Thru-cut) + נקודות, בלי טקסט.</div>
        <p class="muted" style="margin-top:12px">ייוצאו כל הסוגים: ${tabs.map(esc).join(' · ')}. התיקיות נשמרות לפעם הבאה.</p>
        <div class="foot"><button class="primary" id="pGo" ${cfg.printDir && cfg.cutDir ? '' : 'disabled'}>ייצוא</button><button id="pX">ביטול</button></div></div>`;
      d.querySelector('.mx').onclick = () => d.remove(); d.querySelector('#pX').onclick = () => d.remove();
      d.querySelector('#pP').onclick = () => pick('printDir', 'תיקייה לקבצי פרינט');
      d.querySelector('#pC').onclick = () => pick('cutDir', 'תיקייה לקבצי קאט');
      d.querySelector('#pProof').onchange = e => { cfg.proof = e.target.checked; laySave(cfg); };
      d.querySelector('#pGo').onclick = go;
    };
    const go = async () => {
      d.remove();
      await busy('מייצא פריסה…', async () => {
        const star = isWin ? 'x' : '*'; let n = 0;
        try {
          for (const t of tabs) {
            const gs = groupsOf[t]; if (!gs.length) continue;
            const r = await C.buildLayoutPdfs(gs, { ...optsFor(t), splitPrint: true }, `${soNo()} tamnoon ${layJob(t)}`, PDFLib);
            const base = `${soNo() || 'order'} tamnoon ${layJob(t)}`.toLowerCase();
            for (const ps of r.printSheets) { await desk.bankWrite(cfg.printDir, `${base} ${String(ps.no).padStart(3, '0')}${star}${ps.copies}.pdf`, ps.bytes); n++; }
            await desk.bankWrite(cfg.cutDir, `${base} cut.pdf`, r.cut); n++;
            if (cfg.proof) { await desk.bankWrite(cfg.printDir, `${base} proof.pdf`, r.proof); n++; }
          }
          toast(`יוצאו ${n} קבצים<br>פרינט: <b>${esc(cfg.printDir)}</b><br>קאט: <b>${esc(cfg.cutDir)}</b>`, 9000);
          desk.reveal(cfg.printDir);
        } catch (e) { toast('שגיאה בייצוא: ' + esc(e.message || e), 9000); }
      });
    };
    fill(); document.body.appendChild(d);
  };
  draw();
};

/* ---------------- version / update ---------------- */
(async () => {
  if (!desk) { $('#ver').textContent = 'גרסת דפדפן'; return; }
  const cfg = await desk.getCfg();
  S.en = cfg.en || {};
  S.shellVersion = cfg.shellVersion || 1;
  $('#ver').textContent = 'גרסה ' + cfg.version;
  async function check() {
    $('#upd').textContent = 'בודק עדכונים…';
    const u = await desk.checkUpdate();
    if (u.ok && u.available) {
      $('#upd').innerHTML = `<button class="small primary" id="bUpd">יש גרסה חדשה (${u.latest}) – לעדכן</button> <span>${esc(u.notes)}</span>`;
      $('#bUpd').onclick = async () => { $('#bUpd').disabled = true; $('#bUpd').textContent = 'מעדכן…'; const r = await desk.applyUpdate(); if (!r.ok) toast('העדכון נכשל: ' + esc(r.error), 9000); };
    } else {
      $('#upd').innerHTML = (u.ok ? 'הגרסה הכי חדשה ✓' : `<span style="color:var(--red)">לא הצלחתי לבדוק עדכון: ${esc(u.error)}</span>`) + ' <button class="small" id="bChk">בדיקת עדכון</button>';
      $('#bChk').onclick = check;
    }
  }
  check();
})();
// double-clicked .tamnun / .tamnunbank (installer 4+)
async function openPath(p) {
  try {
    const buf = await desk.readFile(p);
    if (/\.tamnunbank$/i.test(p)) await bankImport(buf); else await openJob(buf);
  } catch (e) { toast('לא הצלחתי לפתוח: ' + esc(p)); }
}
if (desk && desk.onOpenFile) {
  desk.onOpenFile(openPath);
  setTimeout(async () => { for (const p of await desk.pendingOpen()) await openPath(p); }, 1500);
}
document.addEventListener('keydown', e => { if (e.key === 'Escape') { const m = [...document.querySelectorAll('.modal-bg')].pop(); if (m) m.remove(); } });
window.__addFiles = addFiles; window.__S = S; window.__recompute = () => recompute();
render();
</script>
