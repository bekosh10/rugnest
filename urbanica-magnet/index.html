<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<title>Urbanica Magnet</title>
<!-- SHEMOT_APP -->
<script src="lib/exceljs.min.js"></script>
<script src="lib/pdf-lib.min.js"></script>
<style>
  :root { --bg:#f4f6f8; --card:#fff; --line:#e2e6ea; --text:#1d2733; --muted:#6b7785; --blue:#1f6feb; --blue2:#e8f0fe; --red:#d93025; --redbg:#fdecea; --yel:#fff6d6; --green:#1e8e3e; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:-apple-system,"SF Pro Text","Segoe UI",Arial,sans-serif; background:var(--bg); color:var(--text); font-size:14px; }
  header { position:sticky; top:0; z-index:5; display:flex; align-items:center; gap:18px; padding:12px 20px; background:var(--card); border-bottom:1px solid var(--line); }
  header h1 { font-size:18px; margin:0; white-space:nowrap; }
  .order { display:flex; align-items:center; gap:8px; }
  .order label { font-weight:600; }
  .order input { font-size:20px; font-weight:700; width:170px; padding:6px 10px; border:2px solid var(--blue); border-radius:8px; direction:ltr; text-align:center; }
  .order input.missing { border-color:var(--red); background:var(--redbg); }
  .order input::placeholder { color:#d98a84; font-size:15px; font-weight:400; }
  .client { color:var(--muted); direction:ltr; }
  .spacer { flex:1; }
  .btns { display:flex; gap:8px; }
  button { font:inherit; padding:8px 14px; border-radius:8px; border:1px solid var(--line); background:#fff; cursor:pointer; }
  button:hover { background:#f0f3f6; }
  button.primary { background:var(--blue); color:#fff; border-color:var(--blue); font-weight:600; }
  button.primary:hover { background:#1a5fd0; }
  button.small { padding:4px 10px; font-size:13px; }
  button:disabled { opacity:.45; cursor:default; }
  main { padding:16px 20px 70px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:14px 16px; margin-bottom:14px; }
  .card h2 { font-size:15px; margin:0 0 10px; display:flex; align-items:center; gap:10px; }
  .card h2 .muted { font-weight:400; }
  .muted { color:var(--muted); font-size:13px; }
  #drop { border:2px dashed #b8c2cc; border-radius:14px; padding:50px 20px; text-align:center; background:#fafbfc; }
  #drop.over, body.over #drop { border-color:var(--blue); background:var(--blue2); }
  #drop .big { font-size:20px; font-weight:600; margin-bottom:8px; }
  .loaded { display:flex; align-items:center; gap:12px; flex-wrap:wrap; }
  .loaded .path { direction:ltr; font-family:Menlo,monospace; font-size:12px; color:var(--muted); }
  table { border-collapse:collapse; width:100%; }
  th, td { padding:6px 8px; border-bottom:1px solid var(--line); text-align:right; vertical-align:middle; }
  th { font-size:12px; color:var(--muted); font-weight:600; background:#fafbfc; position:sticky; top:0; }
  td.ltr, .ltr { direction:ltr; text-align:left; }
  .qty input { width:64px; padding:4px 6px; font-size:15px; text-align:center; border:1px solid var(--line); border-radius:6px; }
  .q4 { display:flex; gap:22px; flex-wrap:wrap; }
  .q4 label { display:flex; flex-direction:column; align-items:center; gap:5px; font-weight:600; }
  .q4 input { width:110px; font-size:22px; font-weight:700; text-align:center; padding:6px; border:2px solid var(--blue); border-radius:8px; }
  .q4 input.missing { border-color:var(--red); background:var(--redbg); }
  .qty input.ovr { border-color:#e8a200; background:#fff6d6; font-weight:700; }
  .qty input::placeholder { color:#aab3bd; }
  .qty input.missing { border-color:var(--red); background:var(--redbg); }
  .qty .none { color:#c3cad2; text-align:center; display:inline-block; width:64px; }
  tr.all td { background:var(--blue2); font-weight:600; }
  tr.all input { border-color:var(--blue); }
  #qtyTable td.qty, #qtyTable th.qty { text-align:center; }
  tr.err td { background:var(--redbg); }
  tr.warn td { background:var(--yel); }
  .issue { color:var(--red); font-size:12px; }
  .newname { font-family:Menlo,monospace; font-size:12.5px; direction:ltr; text-align:left; white-space:nowrap; }
  .orig { font-size:12px; color:var(--muted); }
  select { font:inherit; font-size:12px; padding:2px 4px; }
  .badge { display:inline-block; padding:1px 8px; border-radius:10px; background:#eef1f4; font-size:12px; }
  .badge.red { background:var(--redbg); color:var(--red); }
  .badge.green { background:#e6f4ea; color:var(--green); }
  footer { position:fixed; bottom:0; left:0; right:0; display:flex; align-items:center; gap:12px; padding:8px 20px; background:var(--card); border-top:1px solid var(--line); font-size:12px; color:var(--muted); }
  /* modal */
  .modal-bg { position:fixed; inset:0; background:rgba(20,30,40,.35); display:flex; align-items:flex-start; justify-content:center; padding-top:50px; z-index:20; }
  .modal { background:#fff; border-radius:14px; width:min(820px,94vw); max-height:84vh; overflow:auto; padding:18px 22px; box-shadow:0 10px 40px rgba(0,0,0,.2); }
  .modal h3 { margin:0 0 12px; font-size:18px; }
  .modal h4 { margin:18px 0 6px; font-size:14px; }
  .modal .row { display:flex; gap:8px; align-items:center; margin-bottom:6px; }
  .modal input[type=text] { font:inherit; padding:6px 8px; border:1px solid var(--line); border-radius:6px; }
  .modal input.en { direction:ltr; width:200px; }
  .modal input.he { width:200px; }
  .modal .foot { display:flex; gap:8px; justify-content:flex-start; margin-top:16px; position:sticky; bottom:-18px; background:#fff; padding:10px 0; }
  .maptbl td { border:none; padding:3px 4px; }
  .x { border:none; background:none; color:var(--muted); font-size:16px; padding:2px 8px; }
  .x:hover { color:var(--red); background:none; }
  .layout { display:flex; gap:14px; align-items:flex-start; }
  .mainCol { flex:1; min-width:0; }
  aside#side { width:300px; flex:none; position:sticky; top:76px; padding:0; overflow:hidden; }
  .tabs { display:flex; border-bottom:1px solid var(--line); }
  .tabs button { flex:1; border:none; border-radius:0; padding:10px; background:#fafbfc; color:var(--muted); font-weight:600; }
  .tabs button.on { background:#fff; color:var(--blue); box-shadow:inset 0 -2px 0 var(--blue); }
  .sum { padding:10px 14px 14px; }
  .sum table td, .sum table th { padding:5px 4px; font-size:13px; }
  .sum td.n, .sum th.n { text-align:center; width:56px; }
  .sum tr.tot td { font-weight:700; border-top:2px solid var(--line); border-bottom:none; }
  .sum tr.sub td { color:var(--muted); font-size:12px; }
  .sum tr.sub td:first-child { padding-inline-start:16px; }
  .sum td.n button { white-space:nowrap; }
  .sum tr.divrow td { background:#eef3fd; cursor:pointer; font-weight:700; font-size:14px; border-top:6px solid #fff; }
  .sum tr.divrow:hover td { background:#e2ebfb; }
  .sum tr.divrow .arr { display:inline-block; width:14px; color:var(--blue); }
  .sum tr.prow td { font-weight:600; padding-inline-start:20px; cursor:pointer; }
  .sum tr.prow:hover td { background:#f4f6f8; }
  .sum tr.prow .arr2 { display:inline-block; width:12px; color:#9aa5b1; font-size:11px; }
  .sum tr.prow td:first-child { padding-inline-start:20px; }
  .sum tr.sub td:first-child { padding-inline-start:34px; }
  .sum .big { font-size:16px; font-weight:700; }
  .toast { position:fixed; bottom:50px; left:20px; background:#1d2733; color:#fff; padding:12px 16px; border-radius:10px; z-index:30; max-width:520px; box-shadow:0 6px 24px rgba(0,0,0,.25); }
  .toast button { margin-inline-start:10px; }
  .problems { background:var(--redbg); color:var(--red); border-radius:8px; padding:8px 12px; margin-bottom:10px; font-size:13px; }
  .problems ul { margin:4px 0 0; padding-inline-start:18px; }
</style>
</head>
<body>
<header>
  <h1>Urbanica Magnet</h1>
  <div class="order"><label for="order">מס׳ הזמנה</label><input id="order" placeholder="הקלידי מספר" autocomplete="off"></div>
  <span class="client" id="clientLbl"></span>
  <div class="spacer"></div>
  <div class="btns">
    <button id="bSettings">הגדרות מיפוי</button>
    <button id="bExcel">טבלת אקסל</button>
    <button id="bPdf">PDF לייצור</button>
    <button id="bExport" class="primary">ייצוא</button>
  </div>
</header>

<main>
  <div class="card" id="dropCard">
    <div id="drop">
      <div class="big">גררי לכאן תיקייה</div>
      <div class="muted">אפשר לגרור את התיקייה הראשית (עם גברים / נשים / ילדים) או כל תת-תיקייה. הקבצים המקוריים לא משתנים.</div>
      <div style="margin-top:14px"><button id="bPick">או בחירת תיקייה…</button></div>
    </div>
  </div>
  <div id="work"></div>
</main>

<footer>
  <span id="ver"></span>
  <button class="small" id="bUpd">בדוק עדכון</button>
  <span id="updMsg"></span>
</footer>

<script id="logic">
/* ================= pure logic (no DOM) ================= */
const APP_VERSION = 9;
const DEFAULTS = {
  client: 'urbanica',
  largeSize: '119x159',
  sizeTol: 0.2,
  genders:   [{ he: 'נשים', en: 'women' }, { he: 'גברים', en: 'men' }, { he: 'ילדים', en: 'kid' }],
  divisions: [{ he: 'ארצי', en: 'artzi' }, { he: 'אילת', en: 'eilat' }, { he: 'סטיישן', en: 'station' }],
  promos:    [{ he: "ג'ינסים", en: 'jeans' }, { he: 'פוטרים', en: 'footer' }, { he: "פיג'מות", en: 'pijama' }, { he: 'אקטיב', en: 'active' }],
  subs:      [],
};
const LARGE = 'L';

const norm = s => String(s || '').normalize('NFC').replace(/[׳’‘`´]/g, "'").replace(/[״“”]/g, '"').replace(/[_]+/g, ' ').replace(/\s+/g, ' ').trim().toLowerCase();
const hasHeb = s => /[֐-׿]/.test(s || '');
const findMap = (list, s) => { const n = norm(s); return n ? (list || []).find(m => norm(m.he) === n || (m.en && norm(m.en) === n)) : undefined; };
const sizeKey = s => norm(s).replace(/[×*]/g, 'x').replace(/\s/g, '');
const escRe = s => s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');

// does text contain word w (Hebrew or English) as a separate word? (Hebrew prefixes ל/ה/ב allowed)
function hasWord(text, w) {
  const n = norm(w); if (!n) return false;
  const re = hasHeb(n) ? new RegExp('(^|[^\\u0590-\\u05FF])[לבהו]?' + escRe(n) + '($|[^\\u0590-\\u05FF])')
                       : new RegExp('(^|[^a-z])' + escRe(n) + '($|[^a-z])');
  return re.test(text);
}

/* one file → parsed record. ov = per-file manual choices {gender, div, size} */
function parseFile(f, S, ov = {}) {
  const parts = f.rel.split('/');
  const fname = parts.pop();
  const segs = parts;
  const dot = fname.lastIndexOf('.');
  const base = dot > 0 ? fname.slice(0, dot) : fname;
  const ext = dot > 0 ? fname.slice(dot).toLowerCase() : '';
  const nb = norm(base);
  const r = { id: f.rel, path: f.path, rel: f.rel, fname, ext, issues: [], warns: [] };

  // gender: a folder named like a gender; else a gender word in the file name
  let gi = segs.findIndex(s => S.genders.some(g => norm(g.he) === norm(s) || norm(g.en) === norm(s)));
  let g = gi >= 0 ? findMap(S.genders, segs[gi]) : undefined;
  if (!g) g = S.genders.find(x => hasWord(nb, x.he));
  if (ov.gender) g = S.genders.find(x => x.en === ov.gender) || g;
  r.genderEn = g ? g.en : ''; r.genderHe = g ? g.he : '';
  if (!g) r.issues.push('gender');

  // promo = folder after the gender folder; sub-promo = folders below it
  const promoSeg = gi >= 0 ? segs[gi + 1] : segs[0];
  const subSegs = gi >= 0 ? segs.slice(gi + 2) : segs.slice(1);
  r.promoHe = promoSeg || '';
  const pm = promoSeg ? findMap(S.promos, promoSeg) : undefined;
  r.promoEn = pm ? pm.en : '';
  if (!promoSeg) r.issues.push('promo-missing');
  else if (!pm) r.issues.push('promo-unmapped');

  r.subHe = subSegs.join(' / ');
  r.subUnmapped = [];
  r.subEn = subSegs.map(s => {
    if (!hasHeb(s)) return s.trim();
    const m = findMap(S.subs, s);
    if (!m) { r.subUnmapped.push(s); return ''; }
    return m.en;
  }).filter(Boolean).join(' ');
  if (r.subUnmapped.length) r.issues.push('sub-unmapped');

  // size
  const m = base.match(/(\d{2,3})\s*[xX×*]\s*(\d{2,3})/);
  let size = m ? `${m[1]}x${m[2]}` : '';
  let large = size ? sizeKey(size) === sizeKey(S.largeSize) : null;
  if (ov.size === 'large') large = true; else if (ov.size === 'reg') large = false;
  r.size = large === true ? sizeKey(S.largeSize) : (large === false ? (size && !ov.size ? size : '59x159') : '');
  r.large = large === true;
  if (large === null) r.issues.push('size');

  // division (not for the large magnet)
  let d = S.divisions.find(x => hasWord(nb, x.he) || hasWord(nb, x.en));
  if (ov.div) d = S.divisions.find(x => x.en === ov.div) || d;
  r.divEn = d ? d.en : ''; r.divHe = d ? d.he : '';
  if (!r.large && large !== null && !d) r.issues.push('div');

  r.col = r.large ? LARGE : r.divEn;
  r.groupKey = [r.genderEn || '?', r.promoEn || r.promoHe || '?', r.subEn].join('|');
  return r;
}

function buildName(r, order, S, qty) {
  const p = [String(order || '').trim(), S.client];
  if (r.large) p.push(sizeKey(S.largeSize)); else p.push(r.divEn);
  p.push(r.genderEn, r.promoEn);
  if (r.subEn) p.push(r.subEn);
  if (qty !== '' && qty != null) p.push('x' + qty);
  return p.filter(Boolean).join(' ').replace(/[\\/:*?"<>|]/g, '-').replace(/\s+/g, ' ').trim() + r.ext;
}

const ISSUE_TEXT = {
  'gender': 'לא זוהה מגדר', 'promo-missing': 'הקובץ לא בתוך תיקיית מבצע', 'promo-unmapped': 'מבצע בלי שם באנגלית',
  'sub-unmapped': 'תת-מבצע בלי שם באנגלית', 'size': 'לא זוהה גודל', 'div': 'לא זוהתה חלוקה (ארצי/אילת/סטיישן)',
  'qty': 'חסרה כמות', 'dup': 'שם כפול – יש עוד קובץ עם אותו שם',
};

/* everything the screen / excel / export need */
function compute(files, S, ovs, qty, order, sizes = {}, dismissed = new Set()) {
  const recs = files.map(f => parseFile(f, S, ovs[f.rel] || {}));
  const colOrder = [...new Set(S.divisions.map(d => d.en))].concat(LARGE);
  const gOrder = S.genders.map(g => g.en);
  for (const r of recs) {
    const ov = r.col ? (qty[r.groupKey] || {})[r.col] : '';
    const q = r.col ? (ov !== undefined && ov !== '' ? ov : ((qty['*'] || {})[r.col] ?? '')) : '';
    r.qty = q;
    if (r.col && (q === '' || !(+q > 0))) r.issues.push('qty');
    r.newName = buildName(r, order, S, q);
    // real page size (cm) against the size in the name
    const rs = sizes[r.rel]; r.sizeSt = ''; r.real = '';
    if (rs && rs.st === 'got' && r.size) {
      const exp = r.size.split('x').map(Number).sort((a, b) => a - b);
      const got = [rs.w, rs.h].map(x => x * 2.54 / 72).sort((a, b) => a - b);
      const tol = (+S.sizeTol >= 0 ? +S.sizeTol : 0.2) + 1e-6;
      r.real = got.map(x => String(Math.round(x * 10) / 10)).join('×');
      // files are often built at 1:10 (5.9×15.9 for 59×159) – both scales are fine
      const fits = sc => Math.abs(got[0] - exp[0] / sc) <= tol / sc && Math.abs(got[1] - exp[1] / sc) <= tol / sc;
      r.sizeSt = fits(1) || fits(10) ? 'ok' : 'bad';
    } else if (rs) r.sizeSt = rs.st === 'got' ? '' : rs.st;
  }
  const seen = {};
  for (const r of recs) (seen[r.newName.toLowerCase()] = seen[r.newName.toLowerCase()] || []).push(r);
  for (const k in seen) if (seen[k].length > 1 && !seen[k].some(r => r.issues.some(i => i !== 'qty'))) seen[k].forEach(r => r.issues.push('dup'));

  // groups for the quantity table
  const groups = {};
  for (const r of recs) {
    const g = groups[r.groupKey] || (groups[r.groupKey] = { key: r.groupKey, genderEn: r.genderEn, genderHe: r.genderHe, promoHe: r.promoHe, promoEn: r.promoEn, subHe: r.subHe, subEn: r.subEn, cols: {} });
    if (r.col) g.cols[r.col] = (g.cols[r.col] || 0) + 1;
  }
  const cmpNum = (a, b) => String(a).localeCompare(String(b), 'he', { numeric: true });
  const gi = x => { const i = gOrder.indexOf(x); return i < 0 ? 99 : i; };
  const groupList = Object.values(groups).sort((a, b) => gi(a.genderEn) - gi(b.genderEn) || cmpNum(a.promoHe, b.promoHe) || cmpNum(a.subHe, b.subHe));

  // excel order: division → promo → gender
  const ci = c => { const i = colOrder.indexOf(c); return i < 0 ? 98 : i; };
  const sorted = recs.slice().sort((a, b) => ci(a.col) - ci(b.col) || cmpNum(a.promoHe, b.promoHe) || cmpNum(a.subHe, b.subHe) || gi(a.genderEn) - gi(b.genderEn) || cmpNum(a.rel, b.rel));

  const problems = [];
  if (!String(order || '').trim()) problems.push('חסר מספר הזמנה');
  const cnt = {};
  for (const r of recs) for (const i of r.issues) cnt[i] = (cnt[i] || 0) + 1;
  for (const i in cnt) problems.push(`${ISSUE_TEXT[i]} (${cnt[i]} קבצים)`);

  // names that still need an English mapping
  const unmappedPromos = [...new Set(recs.filter(r => r.issues.includes('promo-unmapped')).map(r => r.promoHe))];
  const unmappedSubs = [...new Set(recs.flatMap(r => r.subUnmapped))];
  // files that should exist but don't: every promo gets every division + the large magnet
  const missing = [];
  for (const g of groupList) {
    if (!g.genderEn || !g.promoEn || !Object.keys(g.cols).length) continue;
    for (const c of colOrder) if (!g.cols[c]) { const k = g.key + '#' + c; missing.push({ key: k, g, col: c, dismissed: dismissed.has(k) }); }
  }
  const sizeBad = sorted.filter(r => r.sizeSt === 'bad');
  return { recs, sorted, groupList, colOrder, problems, unmappedPromos, unmappedSubs, missing, sizeBad };
}

/* ---------- excel ---------- */
const todayStr = (withTime) => { const d = new Date(), z = n => String(n).padStart(2, '0'); return `${z(d.getDate())}.${z(d.getMonth() + 1)}.${d.getFullYear()}` + (withTime ? `, ${z(d.getHours())}:${z(d.getMinutes())}` : ''); };
const divTitle = (c, S) => c === LARGE ? 'מגנט גדול ' + S.largeSize.replace('x', '×') : ((S.divisions.find(d => d.en === c) || {}).he || c);
const sumQty = rs => rs.reduce((a, r) => a + (+r.qty > 0 ? +r.qty : 0), 0);

async function buildExcel(C, S, order) {
  const wb = new ExcelJS.Workbook();
  wb.creator = 'Urbanica Magnet';
  const date = todayStr();
  const BLUE = 'FF2563EB', LIGHT = 'FFF0F5FF', ZEBRA = 'FFF8F9FB', LINE = { style: 'thin', color: { argb: 'FFE5E7EB' } };
  const fill = argb => ({ type: 'pattern', pattern: 'solid', fgColor: { argb } });

  // one sheet per division: ארצי / אילת / סטיישן / 119×159
  for (const c of C.colOrder) {
    const rs = C.sorted.filter(r => r.col === c);
    if (!rs.length) continue;
    const sheetName = c === LARGE ? S.largeSize.replace('x', '×') : divTitle(c, S);
    const ws = wb.addWorksheet(sheetName, {
      views: [{ rightToLeft: true, state: 'frozen', ySplit: 4 }],
      pageSetup: { paperSize: 9, orientation: 'portrait', fitToPage: true, fitToWidth: 1, fitToHeight: 0, horizontalCentered: true, margins: { left: 0.4, right: 0.4, top: 0.5, bottom: 0.5, header: 0.2, footer: 0.2 } },
    });
    ws.columns = [{ key: 'n', width: 5 }, { key: 'name', width: 56 }, { key: 'promo', width: 16 }, { key: 'sub', width: 10 }, { key: 'gender', width: 9 }, { key: 'qty', width: 9 }, { key: 'st', width: 18 }];
    ws.mergeCells('A1:G1');
    const t = ws.getCell('A1'); t.value = `הזמנה ${order}  ·  ${S.client}`; t.font = { size: 22, bold: true }; t.alignment = { vertical: 'middle', horizontal: 'right' };
    ws.getRow(1).height = 40;
    ws.mergeCells('A2:G2');
    const t2 = ws.getCell('A2'); t2.value = `${divTitle(c, S)}   ·   תאריך ${date}   ·   ${rs.length} קבצים   ·   ${sumQty(rs).toLocaleString('he-IL')} יח׳`;
    t2.font = { size: 14, bold: true, color: { argb: 'FF1D4ED8' } }; t2.fill = fill(LIGHT); t2.alignment = { vertical: 'middle', horizontal: 'right', indent: 1 };
    ws.getRow(2).height = 30;
    ws.getRow(3).height = 8;
    const h = ws.getRow(4);
    h.values = ['#', 'שם קובץ', 'מבצע', 'תת-מבצע', 'מגדר', 'כמות', 'סטטוס הדפסה'];
    h.height = 28;
    h.eachCell(cell => { cell.font = { bold: true, color: { argb: 'FFFFFFFF' }, size: 12 }; cell.fill = fill(BLUE); cell.alignment = { vertical: 'middle', horizontal: 'right' }; });
    ['F4', 'A4'].forEach(a => { ws.getCell(a).alignment = { vertical: 'middle', horizontal: 'center' }; });
    rs.forEach((r, i) => {
      const row = ws.addRow({ n: i + 1, name: r.newName, promo: r.promoHe, sub: r.subHe, gender: r.genderHe, qty: r.qty === '' ? '' : +r.qty, st: '' });
      row.height = 32;
      row.eachCell({ includeEmpty: true }, cell => {
        cell.alignment = { vertical: 'middle', horizontal: 'right' };
        cell.border = { bottom: LINE };
        cell.font = { size: 12 };
        if (i % 2) cell.fill = fill(ZEBRA);
      });
      row.getCell('n').alignment = { vertical: 'middle', horizontal: 'center' };
      row.getCell('name').alignment = { vertical: 'middle', horizontal: 'right', indent: 1 };
      row.getCell('qty').alignment = { vertical: 'middle', horizontal: 'center' };
      row.getCell('qty').font = { size: 12, bold: true };
      row.getCell('st').dataValidation = { type: 'list', allowBlank: true, formulae: ['"הודפס,בהדפסה,לא הודפס"'] };
      row.getCell('st').border = { bottom: LINE, left: LINE, right: LINE };
    });
    const last = ws.rowCount;
    const tot = ws.addRow({ name: 'סה״כ', qty: { formula: `SUM(F5:F${last})`, result: sumQty(rs) } });
    tot.height = 30; tot.font = { bold: true, size: 13 };
    tot.getCell('name').alignment = { vertical: 'middle', horizontal: 'right' };
    tot.getCell('qty').alignment = { vertical: 'middle', horizontal: 'center' };
    tot.eachCell({ includeEmpty: true }, cell => { cell.border = { top: { style: 'medium', color: { argb: 'FFD1D5DB' } } }; });
  }

  // quantities matrix
  const cols = C.colOrder;
  const hdr = ws => { const row = ws.getRow(1); row.font = { bold: true, color: { argb: 'FFFFFFFF' } }; row.fill = fill(BLUE); row.alignment = { vertical: 'middle' }; row.height = 24; };
  const wq = wb.addWorksheet('כמויות', { views: [{ rightToLeft: true, state: 'frozen', ySplit: 1 }] });
  wq.columns = [{ header: 'מגדר', key: 'g', width: 9 }, { header: 'מבצע', key: 'p', width: 18 }, { header: 'תת-מבצע', key: 's', width: 12 }]
    .concat(cols.map(c => ({ header: divTitle(c, S), key: 'c_' + c, width: 14 })));
  hdr(wq);
  for (const g of C.groupList) {
    const o = { g: g.genderHe, p: g.promoHe, s: g.subHe };
    for (const c of cols) { const r = C.recs.find(x => x.groupKey === g.key && x.col === c); o['c_' + c] = r ? (r.qty === '' ? '' : +r.qty) : null; }
    const row = wq.addRow(o); row.height = 22;
    cols.forEach((c, i) => { row.getCell(4 + i).alignment = { horizontal: 'center', vertical: 'middle' }; });
  }
  const lq = wq.rowCount, t = { g: 'סה״כ' };
  cols.forEach((c, i) => { const L = String.fromCharCode(68 + i); t['c_' + c] = { formula: `SUM(${L}2:${L}${lq})` }; });
  const tr = wq.addRow(t); tr.font = { bold: true };
  cols.forEach((c, i) => { tr.getCell(4 + i).alignment = { horizontal: 'center' }; });

  // how each file was renamed
  const wm = wb.addWorksheet('שמות מקוריים', { views: [{ rightToLeft: true, state: 'frozen', ySplit: 1 }] });
  wm.columns = [{ header: '#', key: 'n', width: 5 }, { header: 'חלוקה', key: 'd', width: 16 }, { header: 'שם קובץ חדש', key: 'name', width: 58 }, { header: 'קובץ מקורי', key: 'orig', width: 70 }];
  hdr(wm);
  C.sorted.forEach((r, i) => { const row = wm.addRow({ n: i + 1, d: r.col ? divTitle(r.col, S) : '?', name: r.newName, orig: r.rel }); row.getCell('name').alignment = { horizontal: 'left' }; });
  return new Uint8Array(await wb.xlsx.writeBuffer());
}

/* ---------- production sheet PDF: one A4 page per division, in the Campus order style ---------- */
const escH = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
function buildPrintHtml(C, S, order, fontCss) {
  const made = todayStr(true), date = todayStr();
  const dt = c => c === LARGE ? `מגנט גדול <span dir="ltr">${escH(S.largeSize.replace('x', '×'))}</span>` : escH(divTitle(c, S));
  const pages = [];
  for (const c of C.colOrder) {
    const rs = C.sorted.filter(r => r.col === c);
    if (!rs.length) continue;
    const rh = Math.max(16, Math.min(36, Math.floor(650 / (rs.length + 1))));
    pages.push(`<section class="page">
      <div class="hd">
        <div><div class="brand">קמפוס לדפוס דיגיטלי</div><div class="sub">הזמנת עבודה לייצור</div></div>
        <div><div class="ord">${escH(order)}</div><div class="made">הופק: ${escH(made)}</div></div>
      </div>
      <div class="box">
        <div class="div"><div class="k">חלוקה</div><div class="v">${dt(c)}</div></div>
        <div><div class="k">לקוח</div><div class="v">${escH(S.client)}</div></div>
        <div><div class="k">תאריך</div><div class="v">${escH(date)}</div></div>
        <div><div class="k">קבצים</div><div class="v">${rs.length}</div></div>
        <div><div class="k">סה״כ יחידות</div><div class="v">${sumQty(rs).toLocaleString('he-IL')}</div></div>
      </div>
      <table style="--rh:${rh}px">
        <thead><tr><th class="c">#</th><th>שם קובץ</th><th>מבצע</th><th>תת-מבצע</th><th>מגדר</th><th class="c">כמות</th><th class="c">סטטוס הדפסה</th></tr></thead>
        <tbody>${rs.map((r, i) => `<tr><td class="c">${i + 1}</td><td class="name">${escH(r.newName)}</td><td><b>${escH(r.promoHe)}</b></td><td><bdi>${escH(r.subHe)}</bdi></td><td>${escH(r.genderHe)}</td><td class="c q">${escH(r.qty)} יח׳</td><td class="c st"><span></span></td></tr>`).join('')}
        <tr class="tot"><td></td><td>סה״כ</td><td></td><td></td><td></td><td class="c q">${sumQty(rs).toLocaleString('he-IL')} יח׳</td><td></td></tr></tbody>
      </table>
      <div class="ft"><span>קמפוס לדפוס דיגיטלי — מסמך פנימי לרצפת הייצור</span><span>${escH(order)} · ${dt(c)}</span></div>
    </section>`);
  }
  return `<!DOCTYPE html><html dir="rtl" lang="he"><head><meta charset="utf-8"><style>
  @page { size: A4; margin: 0; }
  ${fontCss || ''}
  * { box-sizing: border-box; }
  body { margin: 0; font-family: Heebo, "Arial Hebrew", Arial, sans-serif; color: #111827; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  .page { width: 210mm; height: 296mm; padding: 13mm 12mm 9mm; display: flex; flex-direction: column; page-break-after: always; overflow: hidden; }
  .page:last-child { page-break-after: auto; }
  .hd { display: flex; justify-content: space-between; align-items: flex-start; border-bottom: 3px solid #2563eb; padding-bottom: 10px; }
  .brand { color: #2563eb; font-weight: 700; font-size: 23px; line-height: 1.2; }
  .sub, .made { color: #6b7280; font-size: 11px; margin-top: 3px; }
  .ord { font-weight: 700; font-size: 25px; direction: ltr; text-align: left; line-height: 1.2; }
  .made { text-align: left; }
  .box { margin-top: 14px; background: #f0f5ff; border: 1px solid #dbe4f3; border-radius: 9px; padding: 9px 18px; display: flex; gap: 34px; align-items: flex-end; }
  .box .k { color: #6b7280; font-size: 10.5px; }
  .box .v { font-weight: 700; font-size: 15px; }
  .box .div .v { font-size: 24px; color: #1d4ed8; line-height: 1.1; }
  table { width: 100%; border-collapse: collapse; margin-top: 14px; }
  th { background: #2563eb; color: #fff; font-weight: 700; font-size: 12px; padding: 8px 7px; text-align: right; }
  td { border-bottom: 1px solid #e5e7eb; padding: 0 7px; height: var(--rh); font-size: 12px; }
  tbody tr:nth-child(even) td { background: #f8f9fb; }
  .c { text-align: center; }
  td.name { direction: ltr; text-align: left; font-size: 11px; font-weight: 500; white-space: nowrap; }
  td.q { font-weight: 700; white-space: nowrap; }
  td.st span { display: inline-block; width: 15px; height: 15px; border: 1.5px solid #9ca3af; border-radius: 3px; vertical-align: middle; }
  tr.tot td { font-weight: 700; border-top: 2px solid #d1d5db; border-bottom: none; background: #fff !important; font-size: 13px; }
  .ft { margin-top: auto; border-top: 1px solid #e5e7eb; padding-top: 6px; display: flex; justify-content: space-between; color: #6b7280; font-size: 10px; }
  </style></head><body>${pages.join('')}</body></html>`;
}
</script>

<script>
/* ================= screen ================= */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const D = window.desk;
let S = JSON.parse(JSON.stringify(DEFAULTS));
let files = [], srcPaths = [], ovs = {}, qty = {}, allQty = {}, C = null, cfg = {};
let askedFor = new Set();
let sideTab = 'div', showExc = false;
const openDivs = new Set(), openPromos = new Set();
let sizes = {}, dismissed = new Set(), sizeRun = 0, sizeProg = null, sizeNoApi = false;

async function saveSettings() { if (D) await D.setCfg({ settings: S }); else localStorage.setItem('shemot-settings', JSON.stringify(S)); }
async function init() {
  if (D) { cfg = await D.getCfg(); if (cfg.settings) S = { ...S, ...cfg.settings }; }
  else { try { const s = JSON.parse(localStorage.getItem('shemot-settings')); if (s) S = { ...S, ...s }; } catch (e) {} }
  $('#ver').textContent = 'גרסה ' + (cfg.version || APP_VERSION);
  render();
  if (D) checkUpdate(true);
}

/* ---------- loading folders ---------- */
async function load(paths) {
  if (!D || !paths.length) return;
  const got = await D.scan(paths);
  if (!got.length) { toast('לא נמצאו קבצים בתיקייה'); return; }
  files = got; srcPaths = paths; ovs = {}; qty = {}; allQty = {}; askedFor = new Set(); sizes = {}; dismissed = new Set();
  render();
  askMappings();
  checkSizes();
}
document.addEventListener('dragover', e => { e.preventDefault(); document.body.classList.add('over'); });
document.addEventListener('dragleave', e => { if (!e.relatedTarget) document.body.classList.remove('over'); });
document.addEventListener('drop', e => {
  e.preventDefault(); document.body.classList.remove('over');
  const paths = [...e.dataTransfer.files].map(f => D ? D.pathOf(f) : '').filter(Boolean);
  load(paths);
});
$('#bPick').onclick = async () => { const p = await D.pickFolder({ title: 'בחירת תיקייה' }); if (p) load([p]); };
$('#order').addEventListener('input', () => render(true));

/* ---------- main render ---------- */
function render(soft) {
  $('#clientLbl').textContent = S.client;
  qty['*'] = allQty;
  C = compute(files, S, ovs, qty, $('#order').value, sizes, dismissed);
  $('#order').classList.toggle('missing', files.length > 0 && !$('#order').value.trim());
  $('#dropCard').style.display = files.length ? 'none' : '';
  if (!files.length) { $('#work').innerHTML = ''; return; }
  if (soft) { renderFiles(); renderTop(); renderSide(); return; }
  const colHe = c => c === LARGE ? '\u2066' + S.largeSize.replace('x', '×') + '\u2069' : ((S.divisions.find(d => d.en === c) || {}).he || c);
  const cols = C.colOrder.filter(c => C.groupList.some(g => g.cols[c]));
  let h = `<div class="layout"><div class="mainCol"><div class="card"><div class="loaded" id="topInfo"></div></div>`;
  const nOv = Object.keys(qty).filter(k => k !== '*').reduce((a, k) => a + Object.values(qty[k]).filter(v => v !== '' && v != null).length, 0);
  h += `<div class="card"><h2>כמויות <span class="muted">— ארבעה מספרים לכל העבודה</span></h2>
    <div class="q4">${cols.map(c => `<label><span>${esc(colHe(c))}</span><input type="number" min="1" data-all="${esc(c)}" value="${esc(allQty[c] ?? '')}"></label>`).join('')}</div>
    <div style="margin-top:12px"><button class="small" id="bExc">${showExc ? '▴' : '▾'} חריגים – כמות שונה למבצע מסוים ${nOv ? `<span class="badge" style="background:#fff0c2">${nOv}</span>` : ''}</button></div>
    ${showExc ? `<p class="muted" style="margin:10px 0 6px">משאירים ריק = הכמות הכללית שלמעלה. ממלאים רק איפה שהכמות שונה.</p>
    <table id="qtyTable"><thead><tr><th>מגדר</th><th>מבצע</th><th>תת-מבצע</th>${cols.map(c => `<th class="qty">${esc(colHe(c))}</th>`).join('')}</tr></thead><tbody>
    ${C.groupList.map(g => `<tr><td>${esc(g.genderHe || '?')}</td><td>${esc(g.promoHe)}${g.promoEn ? ` <span class="muted ltr">${esc(g.promoEn)}</span>` : ''}</td><td><bdi>${esc(g.subHe)}</bdi></td>
      ${cols.map(c => `<td class="qty">${g.cols[c] ? `<input type="number" min="1" data-g="${esc(g.key)}" data-c="${esc(c)}" value="${esc((qty[g.key] || {})[c] ?? '')}" placeholder="${esc(allQty[c] ?? '')}">` : '<span class="none">–</span>'}</td>`).join('')}</tr>`).join('')}
    </tbody></table>` : ''}</div>`;
  h += `<div class="card"><h2>קבצים <span class="muted" id="fileCount"></span></h2><div id="problems"></div><table><thead><tr><th>שם חדש</th><th>קובץ מקורי</th><th style="width:230px">הערות</th></tr></thead><tbody id="fileRows"></tbody></table></div></div><aside class="card" id="side"></aside></div>`;
  $('#work').innerHTML = h;
  $('#bExc').onclick = () => { showExc = !showExc; render(); };
  $('#work').querySelectorAll('input[data-g]').forEach(inp => inp.addEventListener('input', () => {
    const g = inp.dataset.g, c = inp.dataset.c, v = inp.value.trim();
    qty[g] = qty[g] || {}; if (v) qty[g][c] = v; else delete qty[g][c];
    render(true); markQty();
  }));
  $('#work').querySelectorAll('input[data-all]').forEach(inp => inp.addEventListener('input', () => {
    const c = inp.dataset.all; allQty[c] = inp.value.trim();
    $('#work').querySelectorAll(`input[data-c="${CSS.escape(c)}"]`).forEach(x => { x.placeholder = allQty[c]; });
    render(true); markQty();
  }));
  renderTop(); renderFiles(); renderSide(); markQty();
}
function markQty() {
  $('#work').querySelectorAll('input[data-all]').forEach(x => { const c = x.dataset.all; x.classList.toggle('missing', C.recs.some(r => r.col === c && r.issues.includes('qty'))); });
  $('#work').querySelectorAll('input[data-g]').forEach(x => { x.classList.toggle('ovr', x.value.trim() !== ''); x.classList.toggle('missing', x.value.trim() === '' && !(+x.placeholder > 0)); });
}
function renderTop() {
  const errs = C.recs.filter(r => r.issues.length).length;
  $('#topInfo').innerHTML = `<b>${C.recs.length} קבצים</b>
    ${errs ? `<span class="badge red">${errs} דורשים טיפול</span>` : '<span class="badge green">הכול מוכן</span>'}
    <span class="path">${esc(srcPaths.join(' , '))}</span><span class="spacer" style="flex:1"></span>
    ${C.unmappedPromos.length + C.unmappedSubs.length ? '<button class="small" id="bMapNow">מיפוי שמות חדשים</button>' : ''}
    <button class="small" id="bClear">ניקוי / תיקייה אחרת</button>`;
  $('#bClear').onclick = () => { files = []; srcPaths = []; sizeRun++; sizeProg = null; render(); };
  if ($('#bMapNow')) $('#bMapNow').onclick = () => { askedFor = new Set(); askMappings(); };
}
function renderFiles() {
  const P = C.problems;
  $('#problems').innerHTML = P.length ? `<div class="problems">לפני ייצוא צריך לטפל ב:<ul>${P.map(p => `<li>${esc(p)}</li>`).join('')}</ul></div>` : '';
  $('#fileCount').textContent = `(${C.recs.length}, לפי סדר האקסל: חלוקה ← מבצע ← מגדר)`;
  const opt = (list, cur) => `<option value="">בחירה…</option>` + list.map(x => `<option value="${esc(x.en)}" ${x.en === cur ? 'selected' : ''}>${esc(x.he)}</option>`).join('');
  const bad = r => r.issues.some(i => i !== 'qty');
  $('#fileRows').innerHTML = C.sorted.filter(bad).concat(C.sorted.filter(r => !bad(r))).map(r => {
    const ov = ovs[r.rel] || {};
    const notes = [];
    for (const i of r.issues) {
      if (i === 'gender') notes.push(`מגדר: <select data-ov="gender" data-f="${esc(r.rel)}">${opt(S.genders, ov.gender)}</select>`);
      else if (i === 'div') notes.push(`חלוקה: <select data-ov="div" data-f="${esc(r.rel)}">${opt(S.divisions, ov.div)}</select>`);
      else if (i === 'size') notes.push(`גודל: <select data-ov="size" data-f="${esc(r.rel)}"><option value="">בחירה…</option><option value="reg">רגיל 59×159</option><option value="large">גדול ${esc(S.largeSize)}</option></select>`);
      else notes.push(`<span class="issue">${esc(ISSUE_TEXT[i])}</span>`);
    }
    if (r.sizeSt === 'bad') notes.push(`<span class="issue">גודל בפועל \u2066${esc(r.real)}\u2069 ס״מ</span>`);
    else if (r.sizeSt === 'wait') notes.push('<span class="muted">בודק גודל…</span>');
    else if (r.sizeSt === 'unk') notes.push('<span class="muted">לא הצלחתי למדוד גודל</span>');
    if (ov.gender || ov.div || ov.size) notes.push(`<button class="small x" title="ביטול בחירה ידנית" data-reset="${esc(r.rel)}">↺</button>`);
    return `<tr class="${r.issues.some(i => i !== 'qty') ? 'err' : (r.issues.length || r.sizeSt === 'bad') ? 'warn' : ''}"><td class="newname">${esc(r.newName)}</td><td class="orig">${r.rel.split('/').map(x => `<bdi>${esc(x)}</bdi>`).join(' / ')}</td><td>${notes.join(' ')}</td></tr>`;
  }).join('');
  $('#fileRows').querySelectorAll('select[data-ov]').forEach(s => s.onchange = () => { const o = ovs[s.dataset.f] = ovs[s.dataset.f] || {}; o[s.dataset.ov] = s.value; render(); });
  $('#fileRows').querySelectorAll('[data-reset]').forEach(b => b.onclick = () => { delete ovs[b.dataset.reset]; render(); });
}

/* ---------- side panel: totals ---------- */
function renderSide() {
  const el = $('#side'); if (!el) return;
  const colHe = c => c === LARGE ? 'מגנט גדול \u2066' + S.largeSize.replace('x', '×') + '\u2069' : ((S.divisions.find(d => d.en === c) || {}).he || c);
  const units = rs => { const ok = rs.filter(r => +r.qty > 0); return { u: ok.reduce((a, r) => a + +r.qty, 0), missing: ok.length < rs.length }; };
  const uTxt = x => x.u ? x.u.toLocaleString('he-IL') + (x.missing ? '<span class="issue">*</span>' : '') : (x.missing ? '<span class="issue">חסר</span>' : '–');
  const withCol = C.recs.filter(r => r.col);
  let body = '';
  const openMiss = C.missing.filter(m => !m.dismissed).length + C.sizeBad.length;
  if (sideTab === 'miss') {
    const lbl = m => `${m.g.genderHe} · ${m.g.promoHe}${m.g.subHe ? ' · ' + m.g.subHe : ''}`;
    const open = C.missing.filter(m => !m.dismissed), done = C.missing.filter(m => m.dismissed);
    body = `<h4 style="margin:4px 0 6px">קבצים חסרים</h4>`;
    body += open.length ? `<table><tbody>${open.map(m => `<tr><td><bdi>${esc(lbl(m))}</bdi><br><span class="issue">חסר: ${esc(colHe(m.col))}</span></td><td class="n"><button class="small" data-dis="${esc(m.key)}" title="זה בכוונה – לא חסר">לא חסר</button></td></tr>`).join('')}</tbody></table>`
      : '<div class="muted">✓ לכל מבצע יש ארצי, אילת, סטיישן ומגנט גדול</div>';
    if (done.length) body += `<div class="muted" style="margin-top:8px">סומנו "לא חסר":</div><table><tbody>${done.map(m => `<tr class="sub"><td><bdi>${esc(lbl(m))}</bdi> – ${esc(colHe(m.col))}</td><td class="n"><button class="small x" data-undis="${esc(m.key)}" title="להחזיר לרשימה">↺</button></td></tr>`).join('')}</tbody></table>`;
    body += `<h4 style="margin:14px 0 6px">גודל לא תואם</h4>`;
    if (sizeNoApi) body += '<div class="muted">כדי למדוד גדלים צריך להתקין את הקובץ החדש של האפליקציה.</div>';
    else {
      if (sizeProg && sizeProg.done < sizeProg.total) body += `<div class="muted">בודק גדלים ${sizeProg.done}/${sizeProg.total}…</div>`;
      body += C.sizeBad.length ? `<table><tbody>${C.sizeBad.map(r => `<tr><td><bdi>${esc(r.genderHe)} · ${esc(r.promoHe)}${r.subHe ? ' · ' + esc(r.subHe) : ''}</bdi> · ${esc(r.large ? colHe(LARGE) : r.divHe)}<br><span class="issue">בפועל \u2066${esc(r.real)}\u2069 – בשם \u2066${esc(r.size.replace('x', '×'))}\u2069</span></td></tr>`).join('')}</tbody></table>`
        : (sizeProg && sizeProg.done >= sizeProg.total ? '<div class="muted">✓ כל הקבצים בגודל הנכון</div>' : '');
      const unk = C.recs.filter(r => r.sizeSt === 'unk').length;
      if (unk) body += `<div class="muted" style="margin-top:6px">${unk} קבצים לא נמדדו</div>`;
    }
  } else if (sideTab === 'div') {
    body = `<table><thead><tr><th>חלוקה</th><th class="n">קבצים</th><th class="n">יח׳</th></tr></thead><tbody>` +
      C.colOrder.map(c => { const rs = withCol.filter(r => r.col === c); if (!rs.length) return ''; return `<tr><td>${esc(colHe(c))}</td><td class="n big">${rs.length}</td><td class="n">${uTxt(units(rs))}</td></tr>`; }).join('') +
      `<tr class="tot"><td>סה״כ</td><td class="n big">${C.recs.length}</td><td class="n">${uTxt(units(withCol))}</td></tr></tbody></table>`;
  } else {
    // division → its promos (click a division to open / close it)
    body = `<div style="text-align:left;margin-bottom:4px"><button class="small x" id="openAll" style="font-size:12px">${C.colOrder.every(c => openDivs.has(c)) ? 'סגירת הכול' : 'פתיחת הכול'}</button></div>
      <table><thead><tr><th>חלוקה / מבצע</th><th class="n">קבצים</th><th class="n">יח׳</th></tr></thead><tbody>`;
    for (const c of C.colOrder) {
      const rs = withCol.filter(r => r.col === c); if (!rs.length) continue;
      const open = openDivs.has(c);
      body += `<tr class="divrow" data-div="${esc(c)}"><td><span class="arr">${open ? '▾' : '◂'}</span> ${esc(colHe(c))}</td><td class="n big">${rs.length}</td><td class="n"><b>${uTxt(units(rs))}</b></td></tr>`;
      if (!open) continue;
      const promos = [...new Set(rs.map(r => r.promoHe))];
      for (const p of promos) {
        const rp = rs.filter(r => r.promoHe === p);
        const pk = c + '|' + p, popen = openPromos.has(pk);
        body += `<tr class="prow" data-pk="${esc(pk)}"><td><span class="arr2">${popen ? '▾' : '◂'}</span> ${esc(p || '?')}</td><td class="n">${rp.length}</td><td class="n">${uTxt(units(rp))}</td></tr>`;
        if (popen) for (const r of rp) body += `<tr class="sub"><td><bdi>${esc(r.genderHe || '?')}${r.subHe ? ' · ' + esc(r.subHe) : ''}</bdi></td><td class="n"></td><td class="n">${uTxt(units([r]))}</td></tr>`;
      }
    }
    body += `<tr class="tot"><td>סה״כ</td><td class="n big">${withCol.length}</td><td class="n">${uTxt(units(withCol))}</td></tr></tbody></table>`;
  }
  el.innerHTML = `<div class="tabs"><button data-t="div" class="${sideTab === 'div' ? 'on' : ''}">לפי חלוקה</button><button data-t="promo" class="${sideTab === 'promo' ? 'on' : ''}">לפי מבצע</button><button data-t="miss" class="${sideTab === 'miss' ? 'on' : ''}">חוסרים ${openMiss ? `<span class="badge red">${openMiss}</span>` : (sizeProg && sizeProg.done < sizeProg.total ? '' : '<span class="badge green">✓</span>')}</button></div>
    <div class="sum">${body}${sideTab !== 'miss' ? '<div class="muted" style="margin-top:8px">יח׳ = סכום הכמויות. <span class="issue">*</span> = עוד חסרות כמויות.</div>' : ''}</div>`;
  el.querySelectorAll('[data-t]').forEach(b => b.onmousedown = () => { sideTab = b.dataset.t; renderSide(); });
  el.querySelectorAll('[data-pk]').forEach(tr => tr.onmousedown = () => { const k = tr.dataset.pk; openPromos.has(k) ? openPromos.delete(k) : openPromos.add(k); renderSide(); });
  el.querySelectorAll('[data-div]').forEach(tr => tr.onmousedown = () => { const c = tr.dataset.div; openDivs.has(c) ? openDivs.delete(c) : openDivs.add(c); renderSide(); });
  if (el.querySelector('#openAll')) el.querySelector('#openAll').onmousedown = () => { const all = C.colOrder.every(c => openDivs.has(c)); C.colOrder.forEach(c => all ? openDivs.delete(c) : openDivs.add(c)); renderSide(); };
  el.querySelectorAll('[data-dis]').forEach(b => b.onmousedown = () => { dismissed.add(b.dataset.dis); render(true); });
  el.querySelectorAll('[data-undis]').forEach(b => b.onmousedown = () => { dismissed.delete(b.dataset.undis); render(true); });
}

/* ---------- real PDF size ---------- */
function boxFromText(t) {
  const re = /\/(TrimBox|MediaBox)\s*\[\s*([-\d.]+)\s+([-\d.]+)\s+([-\d.]+)\s+([-\d.]+)\s*\]/g;
  let m, trim = null, media = null;
  while ((m = re.exec(t))) {
    const b = { w: Math.abs(m[4] - m[2]), h: Math.abs(m[5] - m[3]) };
    if (m[1] === 'TrimBox') { trim = trim || b; } else media = media || b;
  }
  return trim || media;
}
const latin1 = u8 => new TextDecoder('latin1').decode(u8);
async function realSize(p) {
  const CH = 1.5e6;
  const head = await D.readRange({ path: p, start: 0, length: CH });
  let txt = latin1(head.data);
  if (head.size > CH) txt += '\n' + latin1((await D.readRange({ path: p, start: -CH, length: CH })).data);
  let b = boxFromText(txt);
  if (b) return b;
  if (typeof PDFLib === 'undefined') return null;
  const all = head.size > CH ? (await D.readRange({ path: p, start: 0 })).data : head.data;
  b = boxFromText(latin1(all)); if (b) return b;
  const doc = await PDFLib.PDFDocument.load(all, { ignoreEncryption: true, updateMetadata: false });
  const t = doc.getPage(0).getTrimBox();
  return { w: t.width, h: t.height };
}
async function checkSizes() {
  if (!D || !D.readRange) { sizeNoApi = true; render(true); return; }
  const run = ++sizeRun;
  const pdfs = files.filter(f => /\.pdf$/i.test(f.rel));
  pdfs.forEach(f => { sizes[f.rel] = { st: 'wait' }; });
  sizeProg = { done: 0, total: pdfs.length };
  for (const f of pdfs) {
    let r = null;
    try { r = await realSize(f.path); } catch (e) { r = null; }
    if (run !== sizeRun) return;
    sizes[f.rel] = r ? { st: 'got', w: r.w, h: r.h } : { st: 'unk' };
    sizeProg.done++;
    render(true);
  }
}

/* ---------- new names → ask for English ---------- */
function askMappings() {
  const P = C.unmappedPromos.filter(x => !askedFor.has('p:' + x)), SB = C.unmappedSubs.filter(x => !askedFor.has('s:' + x));
  if (!P.length && !SB.length) return;
  P.forEach(x => askedFor.add('p:' + x)); SB.forEach(x => askedFor.add('s:' + x));
  const row = (he, k) => `<div class="row"><input type="text" class="he" value="${esc(he)}" disabled> ← <input type="text" class="en" data-k="${k}" data-he="${esc(he)}" placeholder="שם באנגלית"></div>`;
  const m = modal(`<h3>${P.length ? 'מבצע חדש' : 'תת-מבצע חדש'} – צריך שם באנגלית</h3>
    <p class="muted">השם נשמר בהגדרות המיפוי, ובפעם הבאה הוא יזוהה לבד.</p>
    ${P.length ? `<h4>מבצעים</h4>${P.map(x => row(x, 'p')).join('')}` : ''}
    ${SB.length ? `<h4>תתי-מבצעים</h4>${SB.map(x => row(x, 's')).join('')}` : ''}
    <div class="foot"><button class="primary" id="mSave">שמירה</button><button id="mLater">אחר כך</button></div>`);
  const first = m.querySelector('input.en'); if (first) first.focus();
  m.querySelector('#mLater').onclick = () => closeModal();
  m.querySelector('#mSave').onclick = async () => {
    m.querySelectorAll('input.en').forEach(i => {
      const en = i.value.trim().toLowerCase(); if (!en) return;
      (i.dataset.k === 'p' ? S.promos : S.subs).push({ he: i.dataset.he, en });
    });
    await saveSettings(); closeModal(); render();
  };
  m.addEventListener('keydown', e => { if (e.key === 'Enter') m.querySelector('#mSave').click(); });
}

/* ---------- settings ---------- */
$('#bSettings').onclick = openSettings;
function openSettings() {
  const T = JSON.parse(JSON.stringify(S));
  const sec = (key, title, hint) => `<h4>${title} <span class="muted">${hint || ''}</span></h4><table class="maptbl" data-sec="${key}"><tbody>${
    T[key].map((x, i) => `<tr><td><input type="text" class="he" data-i="${i}" data-f="he" value="${esc(x.he)}" placeholder="עברית"></td><td>←</td><td><input type="text" class="en" data-i="${i}" data-f="en" value="${esc(x.en)}" placeholder="english"></td><td><button class="x" data-del="${i}" title="מחיקה">✕</button></td></tr>`).join('')
  }</tbody></table><button class="small" data-add="${key}">+ הוספה</button>`;
  const draw = () => {
    m.querySelector('#secs').innerHTML =
      sec('promos', 'מבצעים', '(שם התיקייה ← שם בקובץ)') +
      sec('subs', 'תתי-מבצעים', '(רק כשיש עברית בשם התיקייה. שמות כמו <bdi>3=100</bdi> נשארים כמו שהם)') +
      sec('divisions', 'חלוקות', '(המילה בשם הקובץ ← שם בקובץ)') +
      sec('genders', 'מגדרים', '(שם התיקייה ← שם בקובץ)');
    m.querySelectorAll('.maptbl input').forEach(inp => inp.oninput = () => { T[inp.closest('table').dataset.sec][+inp.dataset.i][inp.dataset.f] = inp.value; });
    m.querySelectorAll('[data-del]').forEach(b => b.onclick = () => { T[b.closest('table').dataset.sec].splice(+b.dataset.del, 1); draw(); });
    m.querySelectorAll('[data-add]').forEach(b => b.onclick = () => { T[b.dataset.add].push({ he: '', en: '' }); draw(); const ins = b.previousElementSibling.querySelectorAll('input.he'); ins[ins.length - 1].focus(); });
  };
  const m = modal(`<h3>הגדרות מיפוי</h3>
    <div class="row"><b style="width:110px">שם הלקוח</b><input type="text" class="en" id="sClient" value="${esc(T.client)}"></div>
    <div class="row"><b style="width:110px">מגנט גדול</b><input type="text" class="en" id="sLarge" value="${esc(T.largeSize)}"> <span class="muted">אין בשם חלוקה, הגודל נכתב בשם</span></div>
    <div class="row"><b style="width:110px">סטייה בגודל</b><input type="text" class="en" id="sTol" style="width:80px" value="${esc(T.sizeTol ?? 0.2)}"> <span class="muted">ס״מ – כמה הגודל האמיתי של ה-PDF יכול להיות שונה מהגודל שבשם</span></div>
    <div id="secs"></div>
    <h4>גיבוי</h4><div class="row"><button class="small" id="sExp">שמירת ההגדרות לקובץ…</button><button class="small" id="sImp">טעינת הגדרות מקובץ…</button><button class="small" id="sDef">החזרת ברירת מחדל</button></div>
    <div class="foot"><button class="primary" id="sSave">שמירה</button><button id="sCancel">ביטול</button></div>`);
  draw();
  m.querySelector('#sCancel').onclick = closeModal;
  m.querySelector('#sSave').onclick = async () => {
    T.client = m.querySelector('#sClient').value.trim();
    T.largeSize = sizeKey(m.querySelector('#sLarge').value) || '119x159';
    { const v = parseFloat(m.querySelector('#sTol').value); T.sizeTol = v >= 0 ? v : 0.2; }
    for (const k of ['promos', 'subs', 'divisions', 'genders']) T[k] = T[k].map(x => ({ he: x.he.trim(), en: x.en.trim() })).filter(x => x.he && x.en);
    S = T; await saveSettings(); closeModal(); render();
  };
  m.querySelector('#sExp').onclick = async () => { const p = await D.saveDialog({ name: 'הגדרות Urbanica Magnet.json', data: new TextEncoder().encode(JSON.stringify(S, null, 2)), ext: 'json', title: 'שמירת הגדרות' }); if (p) toast('נשמר'); };
  m.querySelector('#sImp').onclick = async () => {
    const t = await D.openText({ title: 'טעינת הגדרות', ext: 'json' }); if (!t) return;
    try { const j = JSON.parse(t); if (!j.promos || !j.genders) throw 0; S = { ...DEFAULTS, ...j }; await saveSettings(); closeModal(); render(); toast('ההגדרות נטענו'); } catch (e) { toast('הקובץ לא תקין'); }
  };
  m.querySelector('#sDef').onclick = () => { if (confirmBox('להחזיר את ברירת המחדל? כל המיפויים שהוספת יימחקו.')) { const keep = T; Object.assign(keep, JSON.parse(JSON.stringify(DEFAULTS))); draw(); m.querySelector('#sClient').value = keep.client; m.querySelector('#sLarge').value = keep.largeSize; } };
}
function confirmBox(msg) { return window.confirm(msg); }

/* ---------- excel / export ---------- */
function guard() {
  if (!files.length) { toast('קודם צריך לגרור תיקייה'); return false; }
  if (C.problems.length) { toast('לפני כן צריך לתקן: ' + C.problems.join(' · ')); if (!$('#order').value.trim()) $('#order').focus(); $('#problems').scrollIntoView({ behavior: 'smooth', block: 'center' }); return false; }
  const miss = C.missing.filter(m => !m.dismissed).length, bad = C.sizeBad.length;
  if (miss || bad) {
    const msg = [miss ? `${miss} קבצים חסרים` : '', bad ? `${bad} קבצים בגודל לא תואם` : ''].filter(Boolean).join(' ו-');
    if (!confirm(`יש ${msg} (בלשונית "חוסרים").\nלהמשיך בכל זאת?`)) { sideTab = 'miss'; renderSide(); return false; }
  }
  return true;
}
const jobName = () => `${$('#order').value.trim()} ${S.client}`.trim();
$('#bExcel').onclick = async () => {
  render(true); if (!guard()) return;
  const data = await buildExcel(C, S, $('#order').value.trim());
  const p = await D.saveDialog({ name: jobName() + '.xlsx', data, ext: 'xlsx', extName: 'Excel', title: 'שמירת טבלת אקסל', start: cfg.lastOut });
  if (p) toast('האקסל נשמר', p);
};
$('#bExport').onclick = async () => {
  render(true); if (!guard()) return;
  const start = cfg.lastOut || (srcPaths[0] ? srcPaths[0].replace(/\/[^/]+\/?$/, '') : undefined);
  const parent = await D.pickFolder({ title: `איפה ליצור את התיקייה "${jobName()}"?`, start });
  if (!parent) return;
  cfg.lastOut = parent; D.setCfg({ lastOut: parent });
  const xlsx = await buildExcel(C, S, $('#order').value.trim());
  const pdf = D.htmlToPdf ? await makePdf() : null;
  const res = await D.exportFiles({ parent, folderName: jobName(), items: C.sorted.map(r => ({ src: r.path, name: r.newName })), xlsx, pdf });
  if (res.ok) toast(`${res.count} קבצים הועתקו לתיקייה חדשה, והאקסל${pdf ? ' וה-PDF' : ''} נשמרו לידה`, res.dir);
  else toast('שגיאה בייצוא: ' + res.error);
};

/* ---------- PDF ---------- */
let fontCssCache = null;
async function fontCss() {
  if (fontCssCache !== null) return fontCssCache;
  const ranges = { hebrew: 'U+0590-05FF, U+200C-2010, U+20AA, U+25CC, U+FB1D-FB4F', latin: 'U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+2000-206F, U+20AC, U+2122, U+2212, U+FEFF, U+FFFD' };
  const b64 = buf => { const u = new Uint8Array(buf); let s = ''; for (let i = 0; i < u.length; i += 0x8000) s += String.fromCharCode.apply(null, u.subarray(i, i + 0x8000)); return btoa(s); };
  const out = [];
  try {
    for (const w of [400, 500, 700]) for (const sub of ['hebrew', 'latin']) {
      const r = await fetch(`lib/fonts/heebo-${sub}-${w}-normal.woff2`); if (!r.ok) continue;
      out.push(`@font-face{font-family:Heebo;font-style:normal;font-weight:${w};src:url(data:font/woff2;base64,${b64(await r.arrayBuffer())}) format('woff2');unicode-range:${ranges[sub]};}`);
    }
  } catch (e) {}
  return (fontCssCache = out.join('\n'));
}
async function makePdf() { return D.htmlToPdf(buildPrintHtml(C, S, $('#order').value.trim(), await fontCss())); }
$('#bPdf').onclick = async () => {
  render(true); if (!guard()) return;
  if (!D.htmlToPdf) { toast('ל-PDF צריך להתקין את הקובץ החדש של האפליקציה'); return; }
  const data = await makePdf();
  const p = await D.saveDialog({ name: jobName() + '.pdf', data, ext: 'pdf', extName: 'PDF', title: 'שמירת PDF לייצור', start: cfg.lastOut });
  if (p) toast('ה-PDF נשמר', p);
};

/* ---------- updates ---------- */
async function checkUpdate(silent) {
  const r = await D.checkUpdate();
  const b = $('#bUpd');
  if (r.ok && r.available) {
    b.textContent = 'יש גרסה חדשה – לעדכן'; b.classList.add('primary');
    $('#updMsg').textContent = r.notes ? 'מה חדש: ' + r.notes : '';
    b.onclick = async () => { b.disabled = true; b.textContent = 'מעדכן…'; const a = await D.applyUpdate(); if (!a.ok) { b.disabled = false; b.textContent = 'נסי שוב'; $('#updMsg').textContent = a.error; } };
  } else {
    b.textContent = 'בדוק עדכון'; b.classList.remove('primary'); b.onclick = () => checkUpdate(false);
    if (!silent) $('#updMsg').textContent = r.ok ? 'זו הגרסה האחרונה' : 'אין חיבור לבדיקת עדכון';
  }
}
$('#bUpd').onclick = () => checkUpdate(false);

/* ---------- little helpers ---------- */
let modalEl = null;
function modal(html) { closeModal(); modalEl = document.createElement('div'); modalEl.className = 'modal-bg'; modalEl.innerHTML = `<div class="modal">${html}</div>`; document.body.appendChild(modalEl); return modalEl.querySelector('.modal'); }
function closeModal() { if (modalEl) modalEl.remove(); modalEl = null; }
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });
let toastT = null;
function toast(msg, path) {
  document.querySelectorAll('.toast').forEach(t => t.remove());
  const t = document.createElement('div'); t.className = 'toast'; t.innerHTML = esc(msg) + (path ? ' <button class="small">פתיחה</button>' : '');
  if (path) t.querySelector('button').onclick = () => D.reveal(path);
  document.body.appendChild(t); clearTimeout(toastT); toastT = setTimeout(() => t.remove(), path ? 12000 : 4500);
}
init();
</script>
